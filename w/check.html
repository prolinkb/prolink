<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LikCash PRO - سجل العمليات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-color: #1a1a1a; --accent-color: #007aff; --bg-gray: #fcfcfc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
        body { background-color: var(--bg-gray); color: var(--main-color); }

        .header { background: #fff; padding: 18px 25px; display: flex; align-items: center; border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; z-index: 1000; }
        .logo { flex-grow: 1; text-align: center; font-weight: 800; font-size: 18px; }
        .back-btn { font-size: 18px; cursor: pointer; color: #555; text-decoration: none; }

        .main-container { padding: 25px; max-width: 480px; margin: auto; }
        .section-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
        .section-subtitle { font-size: 13px; color: #888; margin-bottom: 25px; }

        .history-item { 
            background: #fff; border: 1px solid #eee; border-radius: 18px; 
            padding: 18px; margin-bottom: 15px; display: flex; 
            justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .status-badge {
            padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: 700;
            display: inline-flex; align-items: center; gap: 5px;
        }
        
        .status-pending { background: #fff9e6; color: #f39c12; }
        .status-success { background: #eefdf5; color: #27ae60; }

        .dot { width: 6px; height: 6px; border-radius: 50%; }
        .dot-pending { background: #f39c12; }
        .dot-success { background: #27ae60; }

        #loader { text-align: center; padding: 40px; color: #999; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn"><i class="fas fa-chevron-right"></i></a>
        <div class="logo">سجل الطلبات</div>
    </div>

    <div class="main-container">
        <h2 class="section-title">تتبع طلباتك</h2>
        <p class="section-subtitle">هنا تظهر حالة تفعيل باقاتك المسجلة</p>
        
        <div id="orders-container">
            <div id="loader">
                <i class="fas fa-circle-notch fa-spin"></i> جاري تحديث البيانات...
            </div>
        </div>
    </div>

    <script>
        // رابط النشر الجديد الخاص بك
        const API_URL = "https://script.google.com/macros/s/AKfycbx0JWFlVcrdb61T8JLbvJVQTJ81I1Yf8FIJ_1F3jTT130m3R9-upoI3Yvi58DZStET6oA/exec";
        const userEmail = localStorage.getItem('user_gmail');

        // الحماية: إذا لم يسجل الدخول يعود للرئيسية
        if (!userEmail) { window.location.href = "../index.html"; }

        async function loadOrders() {
            const container = document.getElementById('orders-container');
            
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // تصفية الطلبات: فقط التي تطابق إيميل المستخدم الحالي
                const myOrders = data.filter(item => 
                    item.email && item.email.toLowerCase().trim() === userEmail.toLowerCase().trim()
                );

                if (myOrders.length === 0) {
                    container.innerHTML = `
                        <div style="text-align:center; padding:50px 20px;">
                            <i class="fas fa-inbox" style="font-size:40px; color:#eee; margin-bottom:15px;"></i>
                            <p style="color:#999; font-size:14px;">لا توجد عمليات مسجلة لهذا الحساب</p>
                        </div>`;
                    return;
                }

                // عرض البيانات (الأحدث فوق)
                container.innerHTML = myOrders.reverse().map(order => {
                    // التحقق من الحالة: "Verefie" تعني مكتمل، أي شيء آخر يعني قيد الانتظار
                    const isDone = (order.statusLabel === "Verefie");
                    const badgeClass = isDone ? "status-success" : "status-pending";
                    const dotClass = isDone ? "dot-success" : "dot-pending";
                    const statusText = isDone ? "مكتمل" : "قيد المراجعة";

                    return `
                        <div class="history-item">
                            <div>
                                <div style="font-weight:800; font-size:15px; margin-bottom:4px;">اشتراك ${order.plan}</div>
                                <div style="font-size:11px; color:#aaa;">
                                    <i class="far fa-calendar-alt"></i> ${new Date(order.date).toLocaleDateString('ar-MA')}
                                </div>
                                <div style="font-size:10px; color:#ccc; font-family:monospace; margin-top:5px;">ID: ${order.refCode}</div>
                            </div>
                            <div style="text-align: left;">
                                <div class="status-badge ${badgeClass}">
                                    <span class="dot ${dotClass}"></span>
                                    ${statusText}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error("Error:", error);
                container.innerHTML = `<p style="text-align:center; color:red; padding:20px;">خطأ في الاتصال بالسيرفر. تأكد من نشر السكريبت كـ Anyone.</p>`;
            }
        }

        // تشغيل الدالة عند تحميل الصفحة
        window.onload = loadOrders;
    </script>
</body>
</html>
