<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LikCash PRO - الداشبورد</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* نفس الستايل اللي عجبك */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #f8f9fa; color: #1a1a1a; }
        .header { background: #fff; padding: 15px 20px; display: flex; align-items: center; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 1000; }
        .logo { flex-grow: 1; text-align: center; font-weight: 900; font-size: 20px; }
        .main-container { padding: 20px; max-width: 450px; margin: auto; }
        .plan-card { background: #fff; border: 1px solid #eee; border-radius: 25px; padding: 25px; margin-bottom: 20px; text-align: center; }
        .price-tag { font-size: 32px; font-weight: 900; margin: 10px 0; display: block; }
        .btn-buy { background: #000; color: #fff; border: none; padding: 18px; width: 100%; border-radius: 15px; font-weight: 700; cursor: pointer; }
        .user-badge { background: #e9ecef; padding: 8px 15px; border-radius: 12px; font-size: 11px; margin-bottom: 15px; display: inline-block; }
        .view-section { display: none; }
        .view-section.active { display: block; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">LikCash PRO</div>
    </div>

    <div class="main-container">
        <div id="shop" class="view-section active">
            <div id="user-display" class="user-badge">...</div>
            <h2 style="margin-bottom: 20px;">اختر باقة للبدء</h2>
            
            <div class="plan-card">
                <p style="color:#888;">الباقة الأساسية</p>
                <span class="price-tag">300 DH</span>
                <button class="btn-buy" onclick="goToPyme('300 DH')">اقتناء الآن</button>
            </div>

            <div class="plan-card">
                <p style="color:#888;">الباقة المتقدمة</p>
                <span class="price-tag">600 DH</span>
                <button class="btn-buy" onclick="goToPyme('600 DH')">اقتناء الآن</button>
            </div>
        </div>
    </div>

    <script>
        const userEmail = localStorage.getItem('user_gmail');
        if (!userEmail) { window.location.href = "../index.html"; }
        document.getElementById('user-display').innerText = "الحساب: " + userEmail;

        function goToPyme(price) {
            localStorage.setItem('selected_plan_price', price);
            // بما أن pyme.html كاين في نفس الملف w/
            window.location.href = "pyme.html"; 
        }
    </script>
</body>
</html>
