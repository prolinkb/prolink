<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main: #1a1a1a; --bg: #fcfcfc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--main); }
        .header { background: #fff; padding: 15px 20px; display: flex; align-items: center; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 1000; }
        .menu-btn { font-size: 20px; cursor: pointer; flex: 1; }
        .logo { flex: 2; text-align: center; font-weight: 800; }
        
        .sidebar { position: fixed; right: -100%; top: 0; width: 260px; height: 100%; background: #fff; z-index: 2000; transition: 0.3s; padding: 40px 20px; box-shadow: -5px 0 20px rgba(0,0,0,0.05); }
        .sidebar.active { right: 0; }
        .nav-link { padding: 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: 600; color: #555; margin-bottom: 5px; border-radius: 10px; }
        .nav-link.active { background: #f0f0f0; color: #000; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 1500; }
        .overlay.active { display: block; }

        .main { padding: 20px; max-width: 500px; margin: auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .card { background: #fff; border-radius: 18px; padding: 20px; margin-bottom: 15px; border: 1px solid #eee; }
        .btn-buy { background: #000; color: #fff; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        
        .history-item { background: #fff; padding: 15px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 5px; }
        .st-pending { background: #fff4e5; color: #d4a017; }
        .st-done { background: #eafff2; color: #27ae60; }
    </style>
</head>
<body>
    <div class="header">
        <div class="menu-btn" onclick="toggleNav()"><i class="fas fa-bars"></i></div>
        <div class="logo">LIKCASH</div>
        <div style="flex:1"></div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleNav()"></div>
    <div class="sidebar" id="sidebar">
        <div class="nav-link active" id="l-shop" onclick="showTab('shop')"><i class="fas fa-store"></i> المتجر</div>
        <div class="nav-link" id="l-hist" onclick="showTab('hist')"><i class="fas fa-history"></i> طلباتي</div>
        <hr style="margin:15px 0; border:none; border-top:1px solid #eee;">
        <div class="nav-link" style="color:red" onclick="localStorage.clear(); location.href='index.html'"><i class="fas fa-sign-out-alt"></i> خروج</div>
    </div>

    <div class="main">
        <div id="shop" class="tab-content active">
            <h2 style="margin-bottom:15px">الباقات</h2>
            <div class="card">
                <div style="display:flex; justify-content:space-between"><b>الفئة 1</b> <span>30 يوم</span></div>
                <div style="font-size:24px; font-weight:900; margin:10px 0">300 DH</div>
                <button class="btn-buy" onclick="buy('300 DH')">شراء</button>
            </div>
            <div class="card">
                <div style="display:flex; justify-content:space-between"><b>الفئة 2</b> <span>30 يوم</span></div>
                <div style="font-size:24px; font-weight:900; margin:10px 0">600 DH</div>
                <button class="btn-buy" onclick="buy('600 DH')">شراء</button>
            </div>
        </div>

        <div id="hist" class="tab-content">
            <h2 style="margin-bottom:15px">سجل الطلبات</h2>
            <div id="hist-list"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbnu4jyFnEOmQgM_2-tWH6bBTGl52lLDeB-YK8860AX4tx8lwnFvbJWBcXqbhwxT0Fn5A/exec";
        const email = localStorage.getItem('user_gmail');
        if(!email) location.href="index.html";

        function toggleNav() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function showTab(t) {
            document.querySelectorAll('.tab-content, .nav-link').forEach(el => el.classList.remove('active'));
            document.getElementById(t).classList.add('active');
            document.getElementById('l-' + (t=='shop'?'shop':'hist')).classList.add('active');
            if(t == 'hist') loadHist();
            toggleNav();
        }

        function buy(p) { localStorage.setItem('selected_plan_price', p); location.href='pyme.html'; }

        async function loadHist() {
            const list = document.getElementById('hist-list');
            list.innerHTML = "جاري التحميل...";
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                const myData = data.filter(d => d.email === email.toLowerCase().trim());
                list.innerHTML = myData.length ? myData.reverse().map(d => {
                    const isOk = d.statusLabel === "Verefie";
                    return `<div class="history-item">
                        <div><b>${d.plan}</b><br><small style="color:#999">${new Date(d.date).toLocaleDateString()}</small></div>
                        <div class="status ${isOk?'st-done':'st-pending'}">${isOk?'مكتمل':'قيد الانتظار'}</div>
                    </div>`;
                }).join('') : "لا توجد طلبات";
            } catch(e) { list.innerHTML = "خطأ في الجلب"; }
        }
    </script>
</body>
</html>
