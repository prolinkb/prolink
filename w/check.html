<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash | الداشبورد</title>
    <style>
        :root {
            --primary: #000;
            --bg: #f4f7f6;
            --card-bg: #fff;
            --text: #333;
            --success: #1e8e3e;
            --pending: #f2994a;
        }

        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .user-info { font-size: 14px; color: #666; }
        
        .orders-container { display: grid; gap: 15px; max-width: 600px; margin: 0 auto; }
        .order-card { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-right: 5px solid var(--primary);
        }

        .status { font-weight: bold; padding: 5px 10px; border-radius: 5px; font-size: 12px; }
        .status-pending { background: #fff4e5; color: var(--pending); }
        .status-success { background: #e6f4ea; color: var(--success); }

        .btn-buy { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: #fff; border: none; padding: 15px 40px;
            border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        #loader { text-align: center; margin-top: 50px; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h2>باقاتي</h2>
        <div class="user-info" id="userDisplay">...</div>
    </div>

    <div id="loader">جاري تحميل باقاتك...</div>
    <div id="ordersList" class="orders-container"></div>

    <button class="btn-buy" onclick="window.location.href='../pyme.html'">+ شراء باقة جديدة</button>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTK9DCO--kObWjqKuW54o0MXcmFCwngFHRCyd3Q4oP4eQRpCAVx4LDh7vfYRnpx4YgWQ/exec";
        
        // 1. التحقق من الهوية (الإيميل اللي تسجل في الصفحة الأولى)
        const userEmail = localStorage.getItem('user_gmail');
        
        if (!userEmail) {
            // إيلا ملقاش الجيميل، كيرجعو لصفحة التسجيل
            window.location.href = "../index.html"; 
        } else {
            document.getElementById('userDisplay').innerText = userEmail;
            loadMyOrders();
        }

        // 2. دالة جلب الباقات الخاصة بالمستخدم فقط
        async function loadMyOrders() {
            const list = document.getElementById('ordersList');
            const loader = document.getElementById('loader');
            
            loader.style.display = "block";
            list.innerHTML = "";

            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();

                // فلترة البيانات: كنجيبو غير اللي عندهم نفس الجيميل
                const myData = data.filter(item => 
                    item.email && item.email.toLowerCase().trim() === userEmail.toLowerCase().trim()
                );

                loader.style.display = "none";

                if (myData.length === 0) {
                    list.innerHTML = "<p style='text-align:center;'>ليس لديك أي طلبات حالياً.</p>";
                    return;
                }

                // عرض الباقات
                myData.forEach(order => {
                    const statusClass = order.statusLabel === "En attente" ? "status-pending" : "status-success";
                    const card = `
                        <div class="order-card">
                            <div style="display:flex; justify-content:space-between; align-items:start;">
                                <div>
                                    <strong style="font-size:18px;">باقة: ${order.plan}</strong><br>
                                    <small style="color:#888;">كود المرجع: ${order.refCode}</small>
                                </div>
                                <span class="status ${statusClass}">${order.statusLabel}</span>
                            </div>
                            <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
                            <div style="font-size:13px; color:#666;">
                                تاريخ الطلب: ${new Date(order.date).toLocaleDateString('ar-MA')}
                            </div>
                        </div>
                    `;
                    list.innerHTML += card;
                });

            } catch (err) {
                loader.style.display = "none";
                list.innerHTML = "<p style='color:red; text-align:center;'>خطأ في تحميل البيانات.</p>";
            }
        }
    </script>
</body>
</html>
