<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LikCash Pro - نظام الباقات الذكي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #fff; color: #000; overflow-x: hidden; }

        /* Header */
        .header { background: #fff; padding: 15px 20px; display: flex; align-items: center; border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; z-index: 1000; }
        .logo { flex-grow: 1; text-align: center; font-weight: 900; font-size: 20px; letter-spacing: -1px; }
        .menu-icon { font-size: 20px; cursor: pointer; width: 30px; }

        /* Sidebar */
        .sidebar { position: fixed; right: -100%; top: 0; width: 85%; max-width: 300px; height: 100%; background: #fff; z-index: 2000; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); padding: 40px 20px; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,0.05); }
        .sidebar.active { right: 0; }
        .nav-item { padding: 16px; border-radius: 12px; cursor: pointer; margin-bottom: 5px; display: flex; align-items: center; gap: 12px; font-weight: 600; color: #555; transition: 0.2s; }
        .nav-item i { width: 20px; text-align: center; }
        .nav-item.active { background: #f5f5f5; color: #000; }

        /* Main Content */
        .main-content { padding: 20px; max-width: 500px; margin: auto; min-height: 80vh; }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Cards & Buttons */
        .card { background: #fff; border: 1px solid #eee; border-radius: 24px; padding: 25px; margin-bottom: 15px; transition: 0.3s; }
        .card:active { transform: scale(0.98); }
        .btn-black { background: #000; color: #fff; border: none; padding: 16px; width: 100%; border-radius: 14px; font-weight: 700; cursor: pointer; font-size: 15px; margin-top: 15px; transition: 0.2s; }
        .btn-black:hover { opacity: 0.9; }

        /* Order Cards */
        .order-card { background: #fff; border: 1px solid #000; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .order-id { font-size: 11px; color: #999; margin-bottom: 8px; display: block; }
        .promo-pill { background: #f9f9f9; padding: 12px; border-radius: 12px; margin: 15px 0; display: flex; justify-content: space-between; align-items: center; border: 1px dashed #ddd; }
        .promo-text { font-family: 'Courier New', monospace; font-weight: 900; font-size: 18px; color: #000; }
        
        /* Steps */
        .steps { display: flex; justify-content: space-between; margin: 15px 0; position: relative; padding: 0 10px; }
        .steps::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #eee; z-index: 1; }
        .dot { width: 12px; height: 12px; background: #eee; border-radius: 50%; z-index: 2; border: 2px solid #fff; }
        .dot.active { background: #000; ring: 2px solid #000; box-shadow: 0 0 0 3px #fff, 0 0 0 5px #000; }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.2); z-index: 1500; backdrop-filter: blur(4px); }
        .overlay.active { display: block; }

        .status-badge { font-size: 10px; padding: 4px 10px; border-radius: 20px; font-weight: 800; text-transform: uppercase; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-verified { background: #d4edda; color: #155724; }
    </style>
</head>
<body>

    <div class="header">
        <div class="menu-icon" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
        <div class="logo">LikCash</div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="nav-item active" id="btn-shop" onclick="showView('shop')"><i class="fas fa-store"></i> المتجر</div>
        <div class="nav-item" id="btn-history" onclick="showView('history')"><i class="fas fa-receipt"></i> باقاتي النشطة</div>
        <div style="border-top: 1px solid #eee; margin: 20px 0;"></div>
        <div class="nav-item" style="color:#ff3b30" onclick="logout()"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</div>
    </div>

    <div class="main-content">
        
        <div id="shop" class="view active">
            <h2 style="margin-bottom: 25px; font-size: 20px; font-weight: 800;">اقتناء باقة جديدة</h2>
            
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <p style="font-size:12px; color:#666; font-weight:600;">الباقة الأساسية</p>
                        <span style="font-size:28px; font-weight:900;">300 DH</span>
                    </div>
                    <div style="text-align:left;">
                        <span style="color:#34c759; font-weight:800; font-size:13px;">+600 DH ربح</span>
                    </div>
                </div>
                <button class="btn-black" onclick="initiateOrder('300 DH', '600 DH')">اقتناء الآن</button>
            </div>

            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <p style="font-size:12px; color:#666; font-weight:600;">الباقة الذهبية</p>
                        <span style="font-size:28px; font-weight:900;">600 DH</span>
                    </div>
                    <div style="text-align:left;">
                        <span style="color:#34c759; font-weight:800; font-size:13px;">+1200 DH ربح</span>
                    </div>
                </div>
                <button class="btn-black" onclick="initiateOrder('600 DH', '1200 DH')">اقتناء الآن</button>
            </div>
        </div>

        <div id="history" class="view">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="font-size: 20px; font-weight: 800;">باقاتي النشطة</h2>
                <i class="fas fa-sync-alt" style="cursor:pointer; color:#999;" onclick="loadOrders()"></i>
            </div>
            <div id="orders-list">
                <p style="text-align:center; color:#ccc; margin-top:100px;">لا توجد باقات حالياً.</p>
            </div>
        </div>

    </div>

    <script>
        // دالة لفتح وإغلاق القائمة الجانبية
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        // دالة للتنقل بين الصفحات
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            document.getElementById('btn-' + viewId).classList.add('active');
            if(document.getElementById('sidebar').classList.contains('active')) toggleSidebar();
            
            if(viewId === 'history') loadOrders();
        }

        // توليد كود فريد (مثال: LC-A1B2C3)
        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let res = '';
            for (let i = 0; i < 6; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
            return 'LC-' + res;
        }

        // بدء عملية الطلب والتحويل لصفحة الدفع
        function initiateOrder(price, profit) {
            const uniqueCode = generateCode();
            
            // تخزين بيانات الباقة مؤقتاً في المتصفح
            const pendingOrder = {
                planPrice: price,
                profit: profit,
                newCode: uniqueCode,
                date: new Date().toLocaleDateString('ar-MA')
            };
            
            localStorage.setItem('pending_order', JSON.stringify(pendingOrder));

            alert('تم اختيار باقة ' + price + '\nسيتم توجيهك الآن لرفع وصل الدفع.');
            
            // التوجه لصفحة pyme.html
            window.location.href = 'pyme.html';
        }

        // عرض الباقات المخزنة (مؤقتاً من LocalStorage أو مستقبلاً من الشيت)
        function loadOrders() {
            const list = document.getElementById('orders-list');
            const savedOrders = JSON.parse(localStorage.getItem('my_orders') || "[]");

            if(savedOrders.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#ccc; margin-top:100px;">لا توجد باقات نشطة حالياً.</p>';
                return;
            }

            list.innerHTML = savedOrders.map(order => `
                <div class="order-card">
                    <div style="display:flex; justify-content:space-between; align-items:start;">
                        <div>
                            <span class="order-id">التاريخ: ${order.date}</span>
                            <strong style="font-size:16px;">باقة ${order.planPrice}</strong>
                        </div>
                        <span class="status-badge ${order.status === 'Verified' ? 'status-verified' : 'status-pending'}">
                            ${order.status === 'Verified' ? 'مفعلة ✅' : 'قيد المراجعة ⏳'}
                        </span>
                    </div>
                    
                    <div class="promo-pill">
                        <span style="font-size:11px; color:#666;">كود الربح الخاص بك:</span>
                        <span class="promo-text">${order.newCode}</span>
                    </div>

                    <div class="steps">
                        <div class="dot active"></div>
                        <div class="dot ${order.status === 'Verified' ? 'active' : ''}"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            `).join('');
        }

        function logout() {
            if(confirm('هل تريد الخروج؟')) {
                localStorage.clear();
                location.reload();
            }
        }

        // تحميل الباقات عند فتح الصفحة
        window.onload = loadOrders;
    </script>
</body>
</html>
