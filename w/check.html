<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash | شراء وتفعيل الباقة</title>
    <style>
        :root { --primary: #1a73e8; --gold: #f9ab00; --bg: #f1f3f4; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg); color: #333; }

        header { background: #fff; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--primary); }

        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }

        /* قسم الباقات */
        .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .price-tag { font-size: 2rem; font-weight: 800; color: #202124; margin: 10px 0; }
        .buy-btn { background: var(--primary); color: #fff; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        .buy-btn:hover { background: #1557b0; }

        /* قسم المهمة (مخفي في الأول) */
        #referral-section { display: none; border-top: 5px solid var(--gold); }
        .status-badge { background: #fff4e5; color: #b06000; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        
        .progress-container { background: #eee; height: 15px; border-radius: 10px; margin: 20px 0; overflow: hidden; }
        .progress-bar { background: var(--gold); width: 0%; height: 100%; transition: 0.5s; }

        .ref-box { background: #f8f9fa; border: 1px dashed #ccc; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .copy-btn { background: #333; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }

        #loading { text-align: center; margin-top: 50px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo">LikCash</div>
        <button onclick="logout()" style="color:red; cursor:pointer; background:none; border:none;">خروج</button>
    </header>

    <div id="loading">جاري التحميل...</div>

    <div class="container" id="main-ui" style="display: none;">
        
        <!-- قسم اختيار الباقة -->
        <div id="shop-section">
            <h2 style="margin-bottom: 20px;">1. اختر باقة الاستثمار</h2>
            <div class="card">
                <h3>الباقة الذهبية</h3>
                <p>فعل الباقة وابدأ بجني الأرباح بعد إكمال المهمة</p>
                <div class="price-tag">100 DH</div>
                <button class="buy-btn" onclick="buyPackage()">شراء الباقة الآن</button>
            </div>
        </div>

        <!-- قسم المهمة بعد الشراء -->
        <div id="referral-section" class="card">
            <div class="status-badge">بانتظار التفعيل ⏳</div>
            <h2>2. تفعيل الباقة (دعوة 3 أصدقاء)</h2>
            <p style="color: #666; margin-top: 10px;">لقد اشتريت الباقة بنجاح! الآن قم بدعوة 3 أشخاص لتفعيل أرباحك.</p>
            
            <div class="progress-container">
                <div class="progress-bar" id="bar"></div>
            </div>
            <div id="counter">0 / 3 أصدقاء</div>

            <div class="ref-box">
                <span id="ref-link" style="font-size: 0.8rem;">https://likcash.com/ref...</span>
                <button class="copy-btn" onclick="copyLink()">نسخ</button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBP77A_0dc3Z1H6jrUmhtapLF1w0Gbe4B8",
            authDomain: "likcash-auth.firebaseapp.com",
            projectId: "likcash-auth",
            storageBucket: "likcash-auth.firebasestorage.app",
            messagingSenderId: "19126222896",
            appId: "1:19126222896:web:0a6416948afa024e53adf5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('main-ui').style.display = 'block';
                document.getElementById('ref-link').innerText = `https://likcash.com/index.html?ref=${user.uid}`;
            } else {
                window.location.href = "../index.html";
            }
        });

        // محاكاة عملية الشراء
        window.buyPackage = () => {
            alert("تم تسجيل طلب الشراء! الآن يجب عليك إكمال المهمة لتفعيل الباقة.");
            document.getElementById('shop-section').style.display = 'none';
            document.getElementById('referral-section').style.display = 'block';
        };

        window.copyLink = () => {
            const link = document.getElementById('ref-link').innerText;
            navigator.clipboard.writeText(link);
            alert("تم نسخ رابط الإحالة!");
        };

        window.logout = () => signOut(auth).then(() => location.reload());
    </script>
</body>
</html>
