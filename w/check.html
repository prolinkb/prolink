<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash | الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a73e8; --success: #28a745; --gold: #f9ab00; --bg: #f8f9fa; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body { background-color: var(--bg); color: #333; padding-bottom: 80px; min-height: 100vh; }

        header { 
            background: #fff; padding: 15px 20px; display: flex; 
            justify-content: space-between; align-items: center; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--primary); }

        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; }

        /* الأقسام */
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* الكروت */
        .card { 
            background: #fff; border-radius: 20px; padding: 25px; 
            margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.02); 
            text-align: center; border: 1px solid #eee;
        }

        .price-tag { font-size: 2.5rem; font-weight: 900; color: var(--primary); margin: 10px 0; }
        .price-tag span { font-size: 1.2rem; color: #888; }

        .btn { 
            width: 100%; padding: 14px; border: none; border-radius: 12px; 
            font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-success { background: var(--success); color: #fff; }

        /* شريط التنقل */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; background: #fff; 
            display: flex; justify-content: space-around; padding: 10px 0; 
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05); z-index: 1000;
        }
        .nav-item { 
            border: none; background: none; color: #aaa; cursor: pointer; 
            display: flex; flex-direction: column; align-items: center; flex: 1;
        }
        .nav-item.active { color: var(--primary); }

        /* الرصيد */
        .balance-box { 
            background: linear-gradient(135deg, #1a73e8, #0d47a1); 
            color: #fff; padding: 30px; border-radius: 20px; margin-bottom: 20px; text-align: center;
        }

        /* شاشة التحميل */
        #loading-screen { 
            position: fixed; inset: 0; background: #fff; 
            display: flex; flex-direction: column; justify-content: center; 
            align-items: center; z-index: 9999; 
        }

        input, select { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- شاشة التحميل -->
    <div id="loading-screen">
        <div style="font-size: 1.5rem; color: var(--primary); font-weight: bold; margin-bottom: 10px;">LikCash</div>
        <div id="loading-text">جاري التحميل...</div>
    </div>

    <header>
        <div class="logo">LikCash</div>
        <button onclick="window.logout()" style="color:#d93025; background:none; border:none; cursor:pointer; font-weight:bold;">خروج</button>
    </header>

    <div class="container" id="main-content">
        
        <!-- القسم 1: المتجر -->
        <div id="shop" class="section active">
            <h2 style="margin-bottom: 20px;">استثمر الآن 🚀</h2>
            <div class="card">
                <h3>الباقة الذهبية</h3>
                <div class="price-tag">100 <span>DH</span></div>
                <p style="color: #666; margin-bottom: 25px;">فعل الباقة وابدأ بجني الأرباح اليومية.</p>
                <button class="btn btn-primary" onclick="window.buyPackage()">شراء الباقة الآن</button>
            </div>
        </div>

        <!-- القسم 2: الداشبورد -->
        <div id="dashboard" class="section">
            <div class="balance-box">
                <p style="opacity: 0.8;">إجمالي الرصيد</p>
                <h1 id="user-balance">0.00 DH</h1>
            </div>
            <div class="card">
                <div style="display: flex; justify-content: space-between;">
                    <b>حالة الباقة:</b>
                    <span id="pkg-status" style="color: #d93025; font-weight: bold;">غير نشطة</span>
                </div>
            </div>
        </div>

        <!-- القسم 3: السحب -->
        <div id="withdraw" class="section">
            <h2>سحب الأرباح 💰</h2>
            <div class="card">
                <p>متاح للسحب</p>
                <h2 id="withdraw-val" style="color: var(--success); margin-bottom: 20px;">0.00 DH</h2>
                <input type="number" id="withdraw-amount" placeholder="أدخل المبلغ">
                <select id="withdraw-method">
                    <option value="">اختر وسيلة الاستلام</option>
                    <option value="cih">CIH Bank</option>
                    <option value="cashplus">Cash Plus</option>
                </select>
                <button class="btn btn-success" onclick="window.requestWithdraw()">تأكيد السحب</button>
            </div>
        </div>

    </div>

    <!-- المنيو السفلي -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="window.nav('shop', this)">🛒 <span>المتجر</span></button>
        <button class="nav-item" onclick="window.nav('dashboard', this)">📊 <span>باقتي</span></button>
        <button class="nav-item" onclick="window.nav('withdraw', this)">💰 <span>السحب</span></button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBP77A_0dc3Z1H6jrUmhtapLF1w0Gbe4B8",
            authDomain: "likcash-auth.firebaseapp.com",
            projectId: "likcash-auth",
            storageBucket: "likcash-auth.firebasestorage.app",
            messagingSenderId: "19126222896",
            appId: "1:19126222896:web:0a6416948afa024e53adf5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userUID = null;

        // --- نظام الحماية ضد التعليق ---
        const hideLoading = () => {
            const loader = document.getElementById('loading-screen');
            if(loader) loader.style.display = 'none';
        };

        // إذا استغرق التحميل أكثر من 7 ثواني، أظهر الصفحة على أي حال
        setTimeout(hideLoading, 7000);

        // وظائف التنقل
        window.nav = (id, btn) => {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            btn.classList.add('active');
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                userUID = user.uid;
                try {
                    const userRef = doc(db, "users", user.uid);
                    const snap = await getDoc(userRef);
                    
                    if (!snap.exists()) {
                        const newUser = { balance: 0, hasPackage: false };
                        await setDoc(userRef, newUser);
                        updateUI(newUser);
                    } else {
                        updateUI(snap.data());
                    }
                } catch (err) {
                    console.error("Firestore Error:", err);
                }
                hideLoading();
            } else {
                window.location.href = "../index.html";
            }
        });

        function updateUI(data) {
            document.getElementById('user-balance').innerText = (data.balance || 0).toFixed(2) + " DH";
            document.getElementById('withdraw-val').innerText = (data.balance || 0).toFixed(2) + " DH";
            if(data.hasPackage) {
                document.getElementById('pkg-status').innerText = "نشطة ✅";
                document.getElementById('pkg-status').style.color = "var(--success)";
            }
        }

        window.buyPackage = async () => {
            if(!userUID) return;
            try {
                await updateDoc(doc(db, "users", userUID), { hasPackage: true });
                alert("تم الشراء بنجاح!");
                location.reload();
            } catch(e) { alert("حدث خطأ في الاتصال"); }
        };

        window.requestWithdraw = () => alert("سيتم مراجعة طلبك.");
        window.logout = () => signOut(auth);

    </script>
</body>
</html>
