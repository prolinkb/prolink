<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash | لوحة التحكم</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { 
            background-color: #f8f9fa; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            color: #333;
        }
        /* واجهة بيضاء احترافية */
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 500px;
            width: 90%;
            display: none; /* مخفية حتى يتأكد السكريبت من الدخول */
        }
        h1 { color: #1a73e8; margin-bottom: 15px; }
        p { color: #5f6368; font-size: 1.1rem; line-height: 1.6; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a73e8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader"></div>
        <p>جاري التحقق من الحساب...</p>
    </div>

    <div class="container" id="main-content">
        <h1>مرحباً بك في LikCash!</h1>
        <p>لقد قمت بتسجيل الدخول بنجاح. هذه هي منطقة الأعضاء الخاصة بك.</p>
        <br>
        <button onclick="logout()" style="padding: 10px 20px; cursor: pointer; border: none; background: #d93025; color: white; border-radius: 5px;">تسجيل الخروج</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBP77A_0dc3Z1H6jrUmhtapLF1w0Gbe4B8",
            authDomain: "likcash-auth.firebaseapp.com",
            projectId: "likcash-auth",
            storageBucket: "likcash-auth.firebasestorage.app",
            messagingSenderId: "19126222896",
            appId: "1:19126222896:web:0a6416948afa024e53adf5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // الحارس: التحقق من حالة المستخدم
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // مستخدم مسجل: أظهر المحتوى وإخفاء اللودينغ
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                // مستخدم متطفل: رده للصفحة الرئيسية
                window.location.href = "../index.html"; 
            }
        });

        // دالة تسجيل الخروج
        window.logout = () => {
            signOut(auth).then(() => {
                window.location.href = "../index.html";
            });
        };
    </script>
</body>
</html>
