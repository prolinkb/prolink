<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #ffffff; }
        #sidebar { transition: transform 0.3s ease-in-out; z-index: 100; }
        .sidebar-open { transform: translateX(0) !important; }
        .page-section { display: none; }
        .active-page { display: block; }
    </style>
</head>
<body class="relative">

    <aside id="sidebar" class="fixed top-0 right-0 h-full w-72 bg-white shadow-2xl transform translate-x-full flex flex-col border-l border-gray-100">
        <div class="p-6 border-b flex justify-between items-center">
            <span class="font-bold text-xl">LikCash</span>
            <button onclick="toggleSidebar()" class="text-2xl text-gray-400">&times;</button>
        </div>
        <nav class="flex-1 p-4 space-y-3">
            <button onclick="showPage('packagesPage')" class="w-full text-right p-4 bg-gray-50 rounded-2xl font-bold flex items-center">🏠 الرئيسية</button>
            <button onclick="showPage('historyPage')" class="w-full text-right p-4 hover:bg-gray-50 rounded-2xl text-gray-600 flex items-center">📋 سجل العمليات</button>
        </nav>
    </aside>

    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/20 hidden z-40"></div>

    <header class="p-4 flex justify-between items-center bg-white border-b sticky top-0 z-30">
        <button onclick="toggleSidebar()" class="p-2 hover:bg-gray-100 rounded-xl">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <h1 id="pageTitle" class="font-black text-lg text-center flex-1">الرئيسية</h1>
        <div id="userLabel" class="text-[10px] bg-gray-100 px-3 py-1 rounded-full font-bold text-gray-600 max-w-[120px] truncate">
            جاري التحميل...
        </div>
    </header>

    <div id="packagesPage" class="page-section active-page p-6 max-w-lg mx-auto">
        <div class="space-y-4">
            <div class="p-6 border border-gray-100 rounded-[2rem] flex justify-between items-center shadow-sm hover:border-black transition cursor-pointer">
                <span class="font-bold text-xl">150 درهم</span>
                <button onclick="buy(150)" class="bg-black text-white px-6 py-2 rounded-xl font-bold text-sm">شراء</button>
            </div>
            <div class="p-6 border-2 border-black rounded-[2rem] flex justify-between items-center shadow-sm cursor-pointer">
                <span class="font-bold text-xl">300 درهم</span>
                <button onclick="buy(300)" class="bg-black text-white px-6 py-2 rounded-xl font-bold text-sm">شراء</button>
            </div>
            <div class="p-6 border border-gray-100 rounded-[2rem] flex justify-between items-center shadow-sm hover:border-black transition cursor-pointer">
                <span class="font-bold text-xl">600 درهم</span>
                <button onclick="buy(600)" class="bg-black text-white px-6 py-2 rounded-xl font-bold text-sm">شراء</button>
            </div>
        </div>
    </div>

    <div id="historyPage" class="page-section p-6 max-w-lg mx-auto">
        <h2 class="text-sm font-bold text-gray-400 mb-6 text-center uppercase">سجل الحساب</h2>
        <div id="logs" class="space-y-3">
            <div class="bg-gray-50 p-4 rounded-3xl flex justify-between items-center border border-gray-100">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm">💰</div>
                    <div>
                        <p class="text-[10px] text-gray-500 font-bold" id="displayEmail">gmail@user.com</p>
                        <p class="text-sm font-bold">آخر عملية شراء</p>
                    </div>
                </div>
                <span class="text-red-500 font-bold" id="lastPrice">0.00</span>
            </div>
        </div>
    </div>

    <script>
        // دالة لجلب الجيمايل من الصفحة index.html (عبر LocalStorage)
        window.onload = function() {
            // كنفترضو أنك في index.html درتي: localStorage.setItem("userEmail", "test@gmail.com");
            const storedEmail = localStorage.getItem("userEmail") || "لا يوجد حساب";
            document.getElementById('userLabel').innerText = storedEmail;
            document.getElementById('displayEmail').innerText = storedEmail;
        };

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('sidebar-open');
            document.getElementById('overlay').classList.toggle('hidden');
        }

        function showPage(pageId) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
            document.getElementById('pageTitle').innerText = (pageId === 'packagesPage') ? 'الرئيسية' : 'سجل العمليات';
            toggleSidebar();
        }

        function buy(price) {
            const email = localStorage.getItem("userEmail");
            document.getElementById('lastPrice').innerText = "-" + price + " DH";
            alert("تم إرسال طلب الباقة للحساب: " + email);
            // هنا كترسل البيانات لـ Google Sheet
        }
    </script>
</body>
</html>
