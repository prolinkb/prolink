<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LikCash PRO - الداشبورد</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-color: #1a1a1a; --accent-color: #007aff; --bg-gray: #fcfcfc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
        body { background-color: var(--bg-gray); color: var(--main-color); line-height: 1.6; overflow-x: hidden; }

        /* Navigation & Header */
        .header { background: #fff; padding: 18px 25px; display: flex; align-items: center; border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; z-index: 1000; }
        .logo { flex-grow: 1; text-align: center; font-weight: 800; font-size: 18px; letter-spacing: 0.5px; }
        .menu-btn { font-size: 20px; cursor: pointer; color: #333; width: 30px; }

        /* Sidebar */
        .sidebar { position: fixed; right: -100%; top: 0; width: 280px; height: 100%; background: #fff; z-index: 2000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 50px 25px; box-shadow: -10px 0 30px rgba(0,0,0,0.1); }
        .sidebar.active { right: 0; }
        .nav-link { padding: 14px 18px; border-radius: 12px; cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; font-weight: 600; color: #666; transition: 0.2s; }
        .nav-link.active { background: #f5f5f7; color: var(--main-color); }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1500; backdrop-filter: blur(3px); }
        .overlay.active { display: block; }

        /* Content */
        .main-container { padding: 20px; max-width: 480px; margin: auto; }
        .view-section { display: none; animation: fadeIn 0.3s ease; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .section-title { font-size: 22px; font-weight: 800; margin-bottom: 5px; color: #000; }
        .section-subtitle { font-size: 13px; color: #888; margin-bottom: 25px; }

        /* Cards (Shop) */
        .biz-card { background: #fff; border-radius: 20px; padding: 25px; margin-bottom: 20px; border: 1px solid #eee; }
        .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .plan-name { font-size: 17px; font-weight: 700; }
        .plan-duration { font-size: 11px; color: #999; background: #f9f9f9; padding: 4px 10px; border-radius: 6px; }
        .price-amount { font-size: 22px; font-weight: 800; display: block; margin-bottom: 15px; }
        .btn-select { background: var(--main-color); color: #fff; border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: 700; cursor: pointer; }

        /* History Items */
        .history-item { background: #fff; border: 1px solid #eee; border-radius: 15px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .status-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
        .pending { background: #fff9e6; color: #f39c12; }
        .verified { background: #eefdf5; color: #27ae60; }
    </style>
</head>
<body>

    <div class="header">
        <div class="menu-btn" onclick="toggleNav()"><i class="fas fa-bars"></i></div>
        <div class="logo">LikCash Dashboard</div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleNav()"></div>

    <div class="sidebar" id="sidebar">
        <div class="nav-link active" id="tab-shop" onclick="showTab('shop')"><i class="fas fa-shopping-bag"></i> المتجر</div>
        <div class="nav-link" id="tab-history" onclick="showTab('history')"><i class="fas fa-history"></i> سجل طلباتي</div>
        <div style="border-top: 1px solid #eee; margin: 20px 0;"></div>
        <div class="nav-link" style="color:#e74c3c" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</div>
    </div>

    <div class="main-container">
        <div id="shop" class="view-section active">
            <h2 class="section-title">الباقات المتاحة</h2>
            <p class="section-subtitle">اختر باقتك المفضلة للبدء</p>
            
            <div class="biz-card">
                <div class="card-head">
                    <div class="plan-name">اشتراك الفئة الأولى</div>
                    <span class="plan-duration">30 يوم</span>
                </div>
                <div class="price-amount">300 DH</div>
                <button class="btn-select" onclick="goToPyme('300 DH')">شراء الآن</button>
            </div>

            <div class="biz-card">
                <div class="card-head">
                    <div class="plan-name">اشتراك الفئة الثانية</div>
                    <span class="plan-duration">30 يوم</span>
                </div>
                <div class="price-amount">600 DH</div>
                <button class="btn-select" onclick="goToPyme('600 DH')">شراء الآن</button>
            </div>
        </div>

        <div id="history" class="view-section">
            <h2 class="section-title">سجل العمليات</h2>
            <p class="section-subtitle">تتبع حالة طلباتك من هنا</p>
            <div id="orders-container"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx0JWFlVcrdb61T8JLbvJVQTJ81I1Yf8FIJ_1F3jTT130m3R9-upoI3Yvi58DZStET6oA/exec";
        const userEmail = localStorage.getItem('user_gmail');

        if (!userEmail) { window.location.href = "../index.html"; }

        function toggleNav() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function showTab(tabId) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
            if(tabId === 'history') loadOrders();
            if(window.innerWidth < 768) toggleNav();
        }

        function goToPyme(price) {
            localStorage.setItem('selected_plan_price', price);
            window.location.href = "pyme.html";
        }

        async function loadOrders() {
            const container = document.getElementById('orders-container');
            container.innerHTML = '<p style="text-align:center; padding:20px; color:#999;">جاري التحميل...</p>';
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                const myRows = data.filter(i => i.email && i.email.toLowerCase() === userEmail.toLowerCase());
                
                if(myRows.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#bbb;">لا توجد عمليات</p>';
                    return;
                }

                container.innerHTML = myRows.reverse().map(row => {
                    const isOk = (row.statusLabel === "Verefie");
                    return `
                        <div class="history-item">
                            <div>
                                <div style="font-weight:700;">${row.plan}</div>
                                <div style="font-size:11px; color:#999;">${new Date(row.date).toLocaleDateString('ar-MA')}</div>
                            </div>
                            <div class="status-badge ${isOk ? 'verified' : 'pending'}">
                                ${isOk ? 'مكتمل' : 'قيد الانتظار'}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) { container.innerHTML = 'خطأ في جلب البيانات'; }
        }

        function logout() { localStorage.clear(); window.location.href = "../index.html"; }
    </script>
</body>
</html>
