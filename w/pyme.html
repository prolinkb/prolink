<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LikCash - تأكيد العملية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* تصميم عصري ممركز في الوسط */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .card-container { 
            width: 100%; 
            max-width: 400px; 
            background: #fff; 
            padding: 35px 25px; 
            border-radius: 30px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            text-align: center; 
        }
        
        .view-step { display: none; animation: fadeIn 0.4s ease-out; }
        .view-step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 22px; font-weight: 800; margin-bottom: 25px; color: #111; }
        
        .bank-info { 
            background: #fdfdfd; 
            border: 1px solid #eee; 
            padding: 20px; 
            border-radius: 20px; 
            margin-bottom: 25px; 
            text-align: right; 
        }
        .bank-info p { font-size: 11px; color: #999; margin-bottom: 5px; }
        .bank-info strong { font-size: 14px; color: #000; display: block; margin-bottom: 15px; word-break: break-all; }

        input { 
            width: 100%; 
            padding: 18px; 
            border: 1.5px solid #f0f0f0; 
            border-radius: 16px; 
            outline: none; 
            margin-bottom: 20px; 
            text-align: center; 
            font-size: 16px;
            background: #fafafa;
            transition: 0.2s;
        }
        input:focus { border-color: #000; background: #fff; }

        .upload-area { 
            border: 2px dashed #ddd; 
            padding: 40px 20px; 
            border-radius: 20px; 
            cursor: pointer; 
            background: #fcfcfc; 
            margin-bottom: 30px; 
            transition: 0.3s;
        }
        .upload-area:hover { border-color: #000; background: #fff; }
        
        .btn-action { 
            background: #000; 
            color: #fff; 
            border: none; 
            padding: 18px; 
            width: 100%; 
            border-radius: 16px; 
            font-weight: 700; 
            font-size: 16px; 
            cursor: pointer; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .btn-action:disabled { background: #ccc; box-shadow: none; }

        .loader-icon { 
            display: none; 
            margin: 10px auto; 
            border: 3px solid #f3f3f3; 
            border-top: 3px solid #000; 
            border-radius: 50%; 
            width: 25px; 
            height: 25px; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card-container">
    
    <div id="v1" class="view-step active">
        <h2>تحويل المبلغ</h2>
        <div class="bank-info">
            <p>RIB CIH BANK:</p>
            <strong>230 000 0000000000 0000 00</strong>
            <p>الاسم الكامل:</p>
            <strong>MOHAMED *******</strong>
        </div>
        <button class="btn-action" onclick="go(2)">لقد قمت بالتحويل ✅</button>
    </div>

    <div id="v2" class="view-step">
        <h2>تأكيد الطلب</h2>
        <input type="text" id="nameInp" placeholder="ادخل اسمك الكامل">
        
        <div class="upload-area" onclick="document.getElementById('fileInp').click()">
            <i class="fas fa-file-invoice" style="font-size: 35px; color: #eee; margin-bottom: 12px;"></i>
            <p id="upLabel" style="font-size: 13px; color: #888;">ارفع صورة الوصل (الروسي)</p>
            <div id="spin" class="loader-icon"></div>
            <input type="file" id="fileInp" hidden accept="image/*" onchange="upload()">
        </div>

        <button class="btn-action" id="sub" onclick="send()" disabled>إرسال البيانات للمراجعة</button>
    </div>

</div>

<script>
    // الرابط الجديد الذي زودتنا به
    const APP_URL = "https://script.google.com/macros/s/AKfycbwLLsdJgGIfrIrFF9rC8woNy6Y4l5UH8SZ-kEyFY-FTH2D1uY-ULJzUVvhEWcAP1FEh4w/exec";
    const IMGBB_KEY = "1b9671dbfcf13881d735b217c84fb360";

    let imgURL = "";
    const orderData = JSON.parse(localStorage.getItem('pending_order'));

    function go(n) {
        document.querySelectorAll('.view-step').forEach(v => v.classList.remove('active'));
        document.getElementById('v' + n).classList.add('active');
    }

    async function upload() {
        const file = document.getElementById('fileInp').files[0];
        if(!file) return;

        document.getElementById('spin').style.display = "block";
        document.getElementById('upLabel').innerText = "جاري الرفع...";

        const fd = new FormData();
        fd.append("image", file);

        try {
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: fd });
            const d = await res.json();
            imgURL = d.data.url;
            
            document.getElementById('upLabel').innerText = "✅ تم رفع الوصل";
            document.getElementById('upLabel').style.color = "#2ecc71";
            document.getElementById('sub').disabled = false;
        } catch (e) {
            document.getElementById('upLabel').innerText = "❌ فشل الرفع، حاول ثانية";
        } finally {
            document.getElementById('spin').style.display = "none";
        }
    }

    function send() {
        const name = document.getElementById('nameInp').value.trim();
        const btn = document.getElementById('sub');

        if(!name) { alert("أدخل اسمك أولاً"); return; }
        if(!orderData) { alert("خطأ في البيانات، اعد الطلب من المتجر"); return; }

        btn.innerText = "جاري الإرسال...";
        btn.disabled = true;

        const payload = {
            name: name,
            receipt: imgURL,
            plan: orderData.planPrice,
            refCode: orderData.newCode
        };

        var xhr = new XMLHttpRequest();
        xhr.open("POST", APP_URL, true);
        xhr.setRequestHeader('Content-Type', 'text/plain;charset=UTF-8');
        
        xhr.onload = function() {
            alert("✅ وصل طلبك! سيظهر في سجل باقاتك 'قيد الانتظار'.");
            localStorage.removeItem('pending_order');
            window.location.href = "index.html"; 
        };

        xhr.onerror = function() {
            alert("حدث خطأ بسيط، يرجى التحقق من السجل.");
            btn.disabled = false;
        };

        xhr.send(JSON.stringify(payload));
    }
</script>

</body>
</html>
