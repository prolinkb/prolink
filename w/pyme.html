<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LikCash - تأكيد الطلب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* تصميم عصري ومنظم في الوسط */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #f9f9f9; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }
        
        .main-container { 
            width: 100%; 
            max-width: 400px; 
            background: #fff; 
            padding: 30px; 
            border-radius: 25px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center; 
        }
        
        .step { display: none; animation: slideUp 0.4s ease; }
        .step.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 20px; font-weight: 800; margin-bottom: 25px; color: #111; }
        
        .bank-box { 
            background: #fcfcfc; 
            border: 1px solid #eee; 
            padding: 20px; 
            border-radius: 20px; 
            margin-bottom: 25px; 
            text-align: right; 
        }
        .bank-box p { font-size: 11px; color: #999; margin-bottom: 5px; }
        .bank-box strong { font-size: 14px; color: #000; display: block; margin-bottom: 12px; word-break: break-all; }

        input { 
            width: 100%; 
            padding: 16px; 
            border: 1.5px solid #f0f0f0; 
            border-radius: 15px; 
            outline: none; 
            margin-bottom: 20px; 
            text-align: center; 
            font-size: 16px;
            background: #fafafa;
        }
        input:focus { border-color: #000; background: #fff; }

        .upload-card { 
            border: 2px dashed #ddd; 
            padding: 40px 20px; 
            border-radius: 20px; 
            cursor: pointer; 
            background: #fdfdfd; 
            margin-bottom: 30px; 
        }
        
        .btn-confirm { 
            background: #000; 
            color: #fff; 
            border: none; 
            padding: 18px; 
            width: 100%; 
            border-radius: 16px; 
            font-weight: 700; 
            font-size: 16px; 
            cursor: pointer; 
        }
        .btn-confirm:disabled { background: #ccc; }

        .loader { 
            display: none; 
            margin: 10px auto; 
            border: 3px solid #f3f3f3; 
            border-top: 3px solid #000; 
            border-radius: 50%; 
            width: 24px; 
            height: 24px; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="main-container">
    
    <div id="s1" class="step active">
        <h2>تحويل مبلغ الباقة</h2>
        <div class="bank-box">
            <p>RIB CIH BANK:</p>
            <strong>230 000 0000000000 0000 00</strong>
            <p>الاسم:</p>
            <strong>MOHAMED *******</strong>
        </div>
        <button class="btn-confirm" onclick="move(2)">أرسلت المبلغ ✅</button>
    </div>

    <div id="s2" class="step">
        <h2>تأكيد بيانات الوصل</h2>
        <input type="text" id="userNameInp" placeholder="اكتب اسمك الكامل">
        
        <div class="upload-card" onclick="document.getElementById('fileInp').click()">
            <i class="fas fa-camera-retro" style="font-size: 30px; color: #ddd; margin-bottom: 10px;"></i>
            <p id="upText" style="font-size: 13px; color: #888;">ارفع صورة الوصل (الروسي)</p>
            <div id="loadingIcon" class="loader"></div>
            <input type="file" id="fileInp" hidden accept="image/*" onchange="uploadToImgBB()">
        </div>

        <button class="btn-confirm" id="finalBtn" onclick="sendToGoogle()" disabled>إرسال الطلب للمراجعة</button>
    </div>

</div>

<script>
    // الرابط الجديد الخاص بك
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqExvcqzlsIUcYV7i4VIMU6HNt0zRmwZtp3bBttPiXI-1G_bBMjyVv453nlsJQc9yJVw/exec";
    const IMGBB_KEY = "1b9671dbfcf13881d735b217c84fb360";

    let finalImgUrl = "";
    const pendingData = JSON.parse(localStorage.getItem('pending_order'));

    function move(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('s' + n).classList.add('active');
    }

    async function uploadToImgBB() {
        const file = document.getElementById('fileInp').files[0];
        if(!file) return;

        document.getElementById('loadingIcon').style.display = "block";
        document.getElementById('upText').innerText = "جاري رفع الوصل...";

        const fd = new FormData();
        fd.append("image", file);

        try {
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: fd });
            const data = await res.json();
            finalImgUrl = data.data.url;
            
            document.getElementById('upText').innerText = "✅ تم رفع الوصل";
            document.getElementById('upText').style.color = "green";
            document.getElementById('finalBtn').disabled = false;
        } catch (e) {
            document.getElementById('upText').innerText = "❌ فشل الرفع";
        } finally {
            document.getElementById('loadingIcon').style.display = "none";
        }
    }

    function sendToGoogle() {
        const name = document.getElementById('userNameInp').value.trim();
        const btn = document.getElementById('finalBtn');

        if(!name) { alert("أدخل اسمك أولاً"); return; }
        
        btn.innerText = "جاري الإرسال...";
        btn.disabled = true;

        const payload = {
            name: name,
            receipt: finalImgUrl,
            plan: pendingData.planPrice,
            refCode: pendingData.newCode
        };

        var xhr = new XMLHttpRequest();
        xhr.open("POST", SCRIPT_URL, true);
        xhr.setRequestHeader('Content-Type', 'text/plain;charset=UTF-8');
        
        xhr.onload = function() {
            alert("✅ تم إرسال طلبك! سيظهر الكود في السجل بعد المراجعة.");
            localStorage.removeItem('pending_order');
            window.location.href = "index.html"; 
        };

        xhr.onerror = function() {
            alert("تنبيه: تحقق من السجل للتأكد من وصول الطلب.");
            btn.disabled = false;
        };

        xhr.send(JSON.stringify(payload));
    }
</script>

</body>
</html>
