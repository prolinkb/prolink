<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LikCash - تأكيد الطلب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #fff; display: flex; justify-content: center; padding: 20px; color: #000; }
        .payment-container { width: 100%; max-width: 400px; text-align: center; }
        
        .step { display: none; animation: fadeIn 0.3s ease; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 20px; font-weight: 800; margin: 20px 0; }
        .bank-card { background: #fcfcfc; border: 1px solid #eee; padding: 20px; border-radius: 20px; margin-bottom: 25px; text-align: right; }
        .bank-card p { font-size: 11px; color: #888; margin-bottom: 4px; }
        .bank-card strong { font-size: 14px; color: #000; display: block; margin-bottom: 12px; word-break: break-all; }

        input { width: 100%; padding: 16px; border: 1px solid #eee; border-radius: 14px; outline: none; margin-bottom: 15px; font-size: 15px; text-align: right; background: #fafafa; }
        .upload-area { border: 2px dashed #eee; padding: 40px 20px; border-radius: 20px; cursor: pointer; background: #fafafa; margin-bottom: 25px; }
        
        .btn-black { background: #000; color: #fff; border: none; padding: 18px; width: 100%; border-radius: 16px; font-weight: 700; font-size: 16px; cursor: pointer; }
        .btn-black:disabled { background: #ccc; cursor: not-allowed; }

        .loader { display: none; margin: 10px auto; border: 3px solid #f3f3f3; border-top: 3px solid #000; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="payment-container">
    
    <div id="p-step1" class="step active">
        <h2>معلومات التحويل</h2>
        <div class="bank-card">
            <p>اسم البنك:</p><strong>CIH BANK</strong>
            <p>رقم الحساب (RIB):</p><strong>230 000 0000000000 0000 00</strong>
            <p>الاسم الكامل:</p><strong>MOHAMED *******</strong>
        </div>
        <button class="btn-black" onclick="showNext(2)">لقد قمت بالتحويل ✅</button>
    </div>

    <div id="p-step2" class="step">
        <h2>تأكيد الطلب</h2>
        <input type="text" id="user-name" placeholder="أدخل اسمك الكامل">
        
        <div class="upload-area" onclick="document.getElementById('file-upload').click()">
            <i class="fas fa-receipt" style="font-size: 30px; color: #ddd; margin-bottom: 10px;"></i>
            <p id="status-text" style="font-size: 13px; color: #666;">ارفع صورة وصل التحويل</p>
            <div id="loader" class="loader"></div>
            <input type="file" id="file-upload" hidden accept="image/*" onchange="uploadFile()">
        </div>

        <button class="btn-black" id="submit-btn" onclick="submitRequest()" disabled>إرسال البيانات</button>
    </div>

</div>

<script>
    // الرابط الجديد الخاص بك
    const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbyibjUyJJWM6U36p2pqp4FeVHDrFsAXR6C7P7Wvi5Gm-DioSU-y4ZSQIH8DaHYfJPTL0Q/exec";
    const IMGBB_API = "1b9671dbfcf13881d735b217c84fb360";

    let imgUrl = "";
    const orderData = JSON.parse(localStorage.getItem('pending_order'));

    function showNext(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('p-step' + n).classList.add('active');
    }

    async function uploadFile() {
        const file = document.getElementById('file-upload').files[0];
        if(!file) return;

        document.getElementById('loader').style.display = "block";
        document.getElementById('status-text').innerText = "جاري رفع الوصل...";

        const formData = new FormData();
        formData.append("image", file);

        try {
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API}`, {
                method: "POST",
                body: formData
            });
            const json = await res.json();
            imgUrl = json.data.url;
            
            document.getElementById('status-text').innerText = "✅ تم الرفع بنجاح";
            document.getElementById('status-text').style.color = "green";
            document.getElementById('submit-btn').disabled = false;
        } catch (e) {
            document.getElementById('status-text').innerText = "❌ فشل الرفع، حاول ثانية";
        } finally {
            document.getElementById('loader').style.display = "none";
        }
    }

    function submitRequest() {
        const name = document.getElementById('user-name').value.trim();
        const btn = document.getElementById('submit-btn');

        if(!name) { alert("يرجى كتابة اسمك"); return; }
        if(!orderData) { alert("خطأ في بيانات الباقة"); return; }

        btn.innerText = "جاري الحفظ في الجدول...";
        btn.disabled = true;

        const payload = {
            name: name,
            receipt: imgUrl,
            plan: orderData.planPrice,
            refCode: orderData.newCode
        };

        var xhr = new XMLHttpRequest();
        xhr.open("POST", GOOGLE_URL, true);
        xhr.setRequestHeader('Content-Type', 'text/plain;charset=UTF-8');
        
        xhr.onload = function() {
            alert("✅ تم الإرسال! كودك الجديد: " + orderData.newCode);
            localStorage.removeItem('pending_order');
            window.location.href = "index.html"; 
        };

        xhr.onerror = function() {
            alert("خطأ في الاتصال بالسيرفر");
            btn.disabled = false;
            btn.innerText = "إرسال البيانات";
        };

        xhr.send(JSON.stringify(payload));
    }
</script>

</body>
</html>
