<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LikCash - تأكيد الطلب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* كود التصميم لجعل كل شيء في الوسط وبشكل أنيق */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }
        
        .container { 
            width: 100%; 
            max-width: 420px; 
            background: #fff; 
            padding: 30px; 
            border-radius: 25px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center; /* توسيط كل العناصر */
        }
        
        .step { display: none; animation: fadeIn 0.4s ease; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 22px; font-weight: 800; margin-bottom: 25px; color: #333; }
        
        .bank-details { 
            background: #fafafa; 
            border: 1px solid #eee; 
            padding: 20px; 
            border-radius: 20px; 
            margin-bottom: 25px; 
            text-align: right; 
        }
        .bank-details p { font-size: 11px; color: #999; margin-bottom: 4px; }
        .bank-details strong { font-size: 14px; color: #222; display: block; margin-bottom: 12px; word-break: break-all; }

        input { 
            width: 100%; 
            padding: 18px; 
            border: 1.5px solid #eee; 
            border-radius: 15px; 
            outline: none; 
            margin-bottom: 20px; 
            text-align: center; /* الكتابة في الوسط */
            font-size: 16px;
            transition: 0.3s;
        }
        input:focus { border-color: #000; }

        .upload-section { 
            border: 2.5px dashed #ddd; 
            padding: 40px 20px; 
            border-radius: 20px; 
            cursor: pointer; 
            background: #fdfdfd; 
            margin-bottom: 30px; 
            transition: 0.3s;
        }
        .upload-section:hover { background: #f0f0f0; border-color: #aaa; }
        
        .btn-pay { 
            background: #000; 
            color: #fff; 
            border: none; 
            padding: 18px; 
            width: 100%; 
            border-radius: 16px; 
            font-weight: 700; 
            font-size: 17px; 
            cursor: pointer; 
        }
        .btn-pay:disabled { background: #ccc; cursor: not-allowed; }

        .loader-spin { 
            display: none; 
            margin: 10px auto; 
            border: 3px solid #f3f3f3; 
            border-top: 3px solid #000; 
            border-radius: 50%; 
            width: 25px; 
            height: 25px; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    
    <div id="step1" class="step active">
        <h2>معلومات الحساب البنكي</h2>
        <div class="bank-details">
            <p>RIB CIH BANK:</p>
            <strong>230 000 0000000000 0000 00</strong>
            <p>صاحب الحساب:</p>
            <strong>MOHAMED *******</strong>
        </div>
        <button class="btn-pay" onclick="next(2)">لقد أرسلت المبلغ</button>
    </div>

    <div id="step2" class="step">
        <h2>تأكيد بيانات الطلب</h2>
        <input type="text" id="userName" placeholder="أدخل اسمك الكامل">
        
        <div class="upload-section" onclick="document.getElementById('fileInp').click()">
            <i class="fas fa-upload" style="font-size: 35px; color: #bbb; margin-bottom: 12px;"></i>
            <p id="upLabel" style="font-size: 13px; color: #777;">اضغط لرفع صورة الوصل</p>
            <div id="loading" class="loader-spin"></div>
            <input type="file" id="fileInp" hidden accept="image/*" onchange="startUpload()">
        </div>

        <button class="btn-pay" id="subBtn" onclick="saveToSheet()" disabled>إرسال البيانات</button>
    </div>

</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzytNTBNuZ0iprv56KwBCL7nkVkEEAQ52tkbGczwdVbfcw5f8s13o44I_431x1R-GuU3Q/exec";
    const IMGBB_KEY = "1b9671dbfcf13881d735b217c84fb360";

    let imgURL = "";
    const orderInfo = JSON.parse(localStorage.getItem('pending_order'));

    function next(s) {
        document.querySelectorAll('.step').forEach(div => div.classList.remove('active'));
        document.getElementById('step' + s).classList.add('active');
    }

    async function startUpload() {
        const file = document.getElementById('fileInp').files[0];
        if(!file) return;

        document.getElementById('loading').style.display = "block";
        document.getElementById('upLabel').innerText = "جاري التحميل...";

        const fd = new FormData();
        fd.append("image", file);

        try {
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: fd });
            const data = await res.json();
            imgURL = data.data.url;
            
            document.getElementById('upLabel').innerText = "✅ تم تحميل الوصل بنجاح";
            document.getElementById('upLabel').style.color = "#2ecc71";
            document.getElementById('subBtn').disabled = false;
        } catch (e) {
            document.getElementById('upLabel').innerText = "❌ فشل التحميل";
        } finally {
            document.getElementById('loading').style.display = "none";
        }
    }

    function saveToSheet() {
        const name = document.getElementById('userName').value.trim();
        const btn = document.getElementById('subBtn');

        if(!name) { alert("أدخل اسمك أولاً"); return; }
        if(!orderInfo) { alert("خطأ في الجلسة"); return; }

        btn.innerText = "جاري الإرسال...";
        btn.disabled = true;

        const payload = {
            name: name,
            receipt: imgURL,
            plan: orderInfo.planPrice,
            refCode: orderInfo.newCode
        };

        var xhr = new XMLHttpRequest();
        xhr.open("POST", SCRIPT_URL, true);
        xhr.setRequestHeader('Content-Type', 'text/plain;charset=UTF-8');
        
        xhr.onload = function() {
            alert("✅ تم إرسال طلبك! الكود هو: " + orderInfo.newCode);
            localStorage.removeItem('pending_order');
            window.location.href = "index.html"; 
        };

        xhr.onerror = function() {
            alert("حدث تنبيه في الإرسال، يرجى التحقق من باقاتك.");
            btn.disabled = false;
        };

        xhr.send(JSON.stringify(payload));
    }
</script>

</body>
</html>
