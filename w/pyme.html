<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LikCash - إتمام الدفع</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
        body { background-color: #ffffff; padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #000; }
        .pyme-card { background: #fff; width: 100%; max-width: 400px; padding: 25px; border-radius: 20px; text-align: center; }
        h2 { font-weight: 800; font-size: 24px; margin-bottom: 10px; }
        .info-box { background: #f9f9f9; padding: 15px; border-radius: 15px; margin-bottom: 25px; border: 1px solid #eee; }
        .selected-plan { font-size: 22px; font-weight: 900; color: #000; }
        .input-group { text-align: right; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 14px; font-weight: 700; color: #333; margin-bottom: 8px; }
        input, select { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; outline: none; background: #fff; transition: 0.3s; cursor: pointer; -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        input:focus, select:focus { border-color: #000; box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }
        .select-wrapper { position: relative; }
        .select-wrapper::after { content: '\f078'; font-family: 'Font Awesome 5 Free'; font-weight: 900; position: absolute; left: 15px; top: 50%; transform: translateY(-50%); pointer-events: none; font-size: 14px; color: #666; }
        .upload-area { border: 2px dashed #ccc; padding: 25px; border-radius: 15px; cursor: pointer; margin-bottom: 25px; position: relative; background: #fafafa; }
        #imgPreview { width: 100%; max-height: 200px; object-fit: contain; border-radius: 10px; display: none; margin-top: 10px; }
        .btn-confirm { background: #000; color: #fff; border: none; padding: 18px; width: 100%; border-radius: 15px; font-weight: 700; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-confirm:disabled { background: #666; cursor: not-allowed; opacity: 0.7; }
        #statusMsg { margin-top: 15px; font-size: 13px; font-weight: 600; min-height: 20px; }
        .bank-details { background: #fff3cd; padding: 15px; border-radius: 15px; margin-bottom: 25px; border: 1px solid #ffeeba; text-align: right; }
        
        .bank-details-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px dashed #dddddd; }
        .bank-details-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .copy-btn { background: #000000; color: #ffffff; border: none; padding: 5px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .copy-btn:active { opacity: 0.7; }
        .bank-logo-container { text-align: center; margin-bottom: 15px; }
        .bank-logo-container img { width: auto; max-width: 140px; height: 50px; max-height: 50px; border-radius: 8px; object-fit: contain; box-shadow: 0 2px 6px rgba(0,0,0,0.08); background: #fff; padding: 4px; }
    </style>
</head>
<body>

    <div class="pyme-card" id="mainCard">
        <div id="step1">
            <h2>اختيار البنك</h2>
            <p style="font-size: 14px; color: #666; margin-bottom: 25px;">اختر البنك المناسب للتحويل</p>
            <div class="input-group">
                <label>البنك</label>
                <div class="select-wrapper">
                    <select id="bankSelect" onchange="showBankDetails()">
                        <option value="">اختر البنك...</option>
                        <option value="attijari">Attijari Bank</option>
                        <option value="bmce">BMCE BANK</option>
                        <option value="cashplus">CASH PLUS</option>
                        <option value="barid">Albarid Bank</option>
                        <option value="bankalik">Bankalik</option>
                        <option value="sg">Societe Generale</option>
                        <option value="cfg">CFG BANK</option>
                        <option value="bp">Bank Populaire</option>
                        <option value="cih">CIH Mobile</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="step2" style="display:none;">
            <h2>تأكيد الطلب</h2>
            <div class="info-box">
                <p style="font-size: 12px; color: #888;">الباقة المختارة:</p>
                <div class="selected-plan" id="planDisplay">---</div>
                <div style="font-size: 11px; margin-top: 5px; color: #555;">كود الإحالة: <span id="refDisplay" style="font-weight:700;">---</span></div>
            </div>

            <div class="bank-details" id="bankInfo"></div>

            <div class="input-group">
                <label>الاسم الكامل</label>
                <input type="text" id="custName" placeholder="مثال: محمد العلوي">
            </div>

            <div class="input-group">
                <label>وصل التحويل</label>
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <div id="uploadPlaceholder">
                        <i class="fas fa-camera" style="font-size: 28px; color: #000;"></i>
                        <p style="font-size: 13px; color: #555; margin-top: 8px;">اضغط لرفع صورة الوصل</p>
                    </div>
                    <input type="file" id="fileInput" hidden accept="image/*" onchange="handleFile(this)">
                    <img id="imgPreview">
                </div>
            </div>

            <button class="btn-confirm" id="sendBtn" onclick="submitToSheet()">إرسال الطلب الآن</button>
        </div>
        <div id="statusMsg"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxUKUQDaP2OQP_CGRvhvZt_SzzujvY-qxRL1bsE5VaLHyvuhjHJUYKtUEDfCgQlOV99oQ/exec";
        const IMGBB_API_KEY = "f2d9be6981c0d0877f86feaf452b22ee";
        
        const userEmail = localStorage.getItem('user_gmail');
        const selectedPrice = localStorage.getItem('selected_plan_price') || "غير محدد";
        const finalRef = localStorage.getItem('final_ref_code') || "نوريفيرايت";

        if (!userEmail) { window.location.href = "index.html"; }
        document.getElementById('planDisplay').innerText = selectedPrice + " MAD";
        document.getElementById('refDisplay').innerText = finalRef;

        const bankData = {
            attijari: { name: "Attijari Bank", holder: "يظهر هنا اسم صاحب الحساب", rib: "0000 0000 0000 0000 0000", img: "https://i.ibb.co/SXwSWwk9/image.png" },
            bmce: { name: "BMCE BANK", holder: "يظهر هنا اسم صاحب الحساب", rib: "0000 0000 0000 0000 0000", img: "https://i.ibb.co/v62JGcVr/image.png" },
            cashplus: { name: "CASH PLUS", holder: "يظهر هنا اسم صاحب الحساب", rib: "0000 0000 0000 0000 0000", img: "https://i.ibb.co/k2Gt81Bf/image.png" },
            barid: { name: "Albarid Bank", holder: "يظهر هنا اسم صاحب الحساب", rib: "0000 0000 0000 0000 0000", img: "https://i.ibb.co/Hf8mtGp5/image.png" },
            bankalik: { name: "Bankalik", holder: "يظهر here اسم صاحب الحساب", rib: "0000 0000 0000 0000 0000", img: "https://i.ibb.co/1GSXZyVT/image.png" },
            sg: { name: "Societe Generale", holder: "يظهر هنا اسم صاحب الحساب", rib: "0000 0000 0000 0000 0000", img: "https://i.ibb.co/Kc5CM8zM/image.png" },
            cfg: { name: "CFG BANK", holder: "يظهر هنا اسم صاحب الحساب", rib: "0000 0000 0000 0000 0000", img: "https://i.ibb.co/dsRtDQ6N/image.png" },
            bp: { name: "Bank Populaire", holder: "يظهر هنا اسم صاحب الحساب", rib: "0000 0000 0000 0000 0000", img: "https://i.ibb.co/Hf8mtGp5/image.png" },
            cih: { name: "CIH Mobile", holder: "يظهر هنا اسم صاحب الحساب", rib: "0000 0000 0000 0000 0000", img: "https://i.ibb.co/gMwMBLww/image.png" }
        };

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "تم نسخها";
                setTimeout(() => { btn.innerText = originalText; }, 1500);
            }).catch(() => {
                alert("فشل النسخ التلقائي، يمكنك النسخ يدوياً");
            });
        }

        function showBankDetails() {
            const val = document.getElementById('bankSelect').value;
            if (!val) return;
            const b = bankData[val];
            
            document.getElementById('bankInfo').innerHTML = `
                <div class="bank-logo-container">
                    <img src="${b.img}" alt="${b.name}">
                </div>
                <div class="bank-details-row">
                    <span><strong>البنك:</strong> ${b.name}</span>
                </div>
                <div class="bank-details-row">
                    <span><strong>الاسم:</strong> ${b.holder}</span>
                    <button class="copy-btn" onclick="copyToClipboard('${b.holder}', this)">نسخ</button>
                </div>
                <div class="bank-details-row">
                    <span><strong>RIB:</strong> ${b.rib}</span>
                    <button class="copy-btn" onclick="copyToClipboard('${b.rib}', this)">نسخ</button>
                </div>
            `;
            
            document.getElementById('step1').style.display = "none";
            document.getElementById('step2').style.display = "block";
        }

        let base64Img = "";

        function handleFile(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    base64Img = e.target.result;
                    document.getElementById('imgPreview').src = base64Img;
                    document.getElementById('imgPreview').style.display = "block";
                    document.getElementById('uploadPlaceholder').style.display = "none";
                };
                reader.readAsDataURL(file);
            }
        }

        async function uploadToImgBB(base64Data) {
            const formData = new FormData();
            formData.append("image", base64Data.split(",")[1]);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: "POST",
                body: formData
            });
            const data = await response.json();
            return data.success ? data.data.url : null;
        }

        async function submitToSheet() {
            const name = document.getElementById('custName').value.trim();
            const btn = document.getElementById('sendBtn');
            const status = document.getElementById('statusMsg');

            if (!name || !base64Img) { alert("يرجى إكمال البيانات"); return; }

            btn.disabled = true;
            btn.innerText = "جاري الإرسال...";
            status.innerText = "جاري معالجة الطلب...";

            try {
                const uploadedImageUrl = await uploadToImgBB(base64Img);
                const payload = {
                    name: name,
                    email: userEmail,
                    plan: selectedPrice,
                    receipt: uploadedImageUrl, 
                    refCode: "LC" + Math.floor(10000 + Math.random() * 90000),
                    enteredCode: finalRef
                };

                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                
                const resultText = await response.text();
                const resData = JSON.parse(resultText);

                if (resData.result === "SUCCESS") {
                    status.style.color = "green";
                    status.innerText = "تم الإرسال بنجاح!";
                    setTimeout(() => { window.location.href = "check.html"; }, 2000);
                } else if (resData.message === "وصل الحد الأقصى") {
                    btn.disabled = false;
                    btn.innerText = "إرسال الطلب الآن";
                    status.style.color = "red";
                    status.innerText = "وصل كود الإحالة هذا إلى الحد الأقصى (3 إحالات مفعّلة).";
                    alert("عذرًا، كود الإحالة هذا استوفى جميع الإحالات المفعّلة المسموح بها (3/3)!");
                } else if (resData.message === "الكود المستعمل غير مفعل") {
                    btn.disabled = false;
                    btn.innerText = "إرسال الطلب الآن";
                    status.style.color = "red";
                    status.innerText = "خطأ: كود الإحالة المستعمل غير مفعل حالياً.";
                    alert("عذرًا، كود الإحالة هذا غير مفعل من قبل الإدارة بعد، لا يمكنك إتمام العملية به!");
                } else {
                    btn.disabled = false;
                    btn.innerText = "إعادة المحاولة";
                    status.style.color = "red";
                    status.innerText = "خطأ: " + resData.message;
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerText = "إعادة المحاولة";
                status.style.color = "red";
                status.innerText = "خطأ في الاتصال بالخادم.";
            }
        }
    </script>
</body>
</html>
