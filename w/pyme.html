<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash - تأكيد الدفع</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #ffffff; color: #333; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 400px; min-height: 100vh; padding: 20px; background: #fff; }
        
        .step { display: none; animation: fadeIn 0.3s; text-align: center; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h2 { font-size: 18px; font-weight: 800; margin-bottom: 25px; color: #000; }

        /* خيارات الأبناك */
        .bank-option { display: flex; align-items: center; padding: 12px 15px; border: 1px solid #eee; border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .bank-option:active { background: #f9f9f9; transform: scale(0.98); }
        .bank-option span { font-weight: 600; font-size: 14px; flex-grow: 1; text-align: right; }

        /* بطاقة معلومات الحساب */
        .info-card { background: #fcfcfc; border: 1px solid #eee; padding: 15px; border-radius: 15px; margin-bottom: 20px; text-align: right; }
        .info-card p { font-size: 11px; color: #888; margin-bottom: 2px; }
        .info-card strong { font-size: 13px; color: #000; display: block; margin-bottom: 10px; word-break: break-all; }

        /* أزرار التحكم */
        .btn-main { background: #000; color: #fff; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; margin-bottom: 10px; transition: 0.3s; }
        .btn-main:disabled { background: #ccc; cursor: not-allowed; }
        .btn-link { background: none; color: #999; border: none; font-size: 12px; text-decoration: underline; cursor: pointer; }

        /* المدخلات ورفع الملفات */
        input { width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 10px; outline: none; margin-bottom: 15px; font-size: 14px; text-align: right; }
        .upload-box { border: 1px dashed #ccc; padding: 20px; border-radius: 12px; cursor: pointer; background: #fafafa; margin-bottom: 15px; position: relative; }
        
        .loading-spinner { display: none; margin: 10px auto; border: 3px solid #f3f3f3; border-top: 3px solid #000; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- المرحلة 1: اختيار البنك -->
    <div id="step1" class="step active">
        <h2>اختر وسيلة الدفع</h2>
        <div class="bank-option" onclick="openBank('CIH BANK', '230 000 0000000000 00', 'MOHAMED ***')">
            <span>CIH BANK</span>
            <i class="fas fa-university" style="color:#000; margin-right: 10px;"></i>
        </div>
        <div class="bank-option" onclick="openBank('AL BARID BANK', '120 000 0000000000 00', 'MOHAMED ***')">
            <span>AL BARID BANK</span>
            <i class="fas fa-envelope" style="color:#000; margin-right: 10px;"></i>
        </div>
    </div>

    <!-- المرحلة 2: عرض معلومات الحساب -->
    <div id="step2" class="step">
        <h2>بيانات التحويل</h2>
        <div class="info-card">
            <p>اسم البنك:</p><strong id="b-name">--</strong>
            <p>رقم الحساب (RIB):</p><strong id="b-rib">--</strong>
            <p>الاسم الكامل:</p><strong id="b-owner">--</strong>
        </div>
        <button class="btn-main" onclick="showStep(3)">لقد أرسلت المال ✅</button>
        <button class="btn-link" onclick="showStep(1)">رجوع</button>
    </div>

    <!-- المرحلة 3: رفع الوصل والإرسال النهائي -->
    <div id="step3" class="step">
        <h2>تأكيد الطلب</h2>
        <input type="text" id="u-name" placeholder="الاسم الكامل بالفرنسية">
        
        <div class="upload-box" onclick="document.getElementById('u-file').click()">
            <i class="fas fa-cloud-upload-alt" style="font-size: 24px; color: #aaa;"></i>
            <p id="u-status" style="font-size: 12px; color: #999; margin-top: 8px;">ارفع صورة الوصل (الروسي)</p>
            <div id="spinner" class="loading-spinner"></div>
            <input type="file" id="u-file" hidden accept="image/*" onchange="uploadToImgBB()">
        </div>

        <button class="btn-main" id="final-btn" onclick="sendToGoogleSheets()" disabled>تأكيد وإرسال الطلب</button>
        <button class="btn-link" onclick="showStep(2)">رجوع</button>
    </div>

</div>

<script>
    // الإعدادات الخاصة بك
    const IMGBB_KEY = "1b9671dbfcf13881d735b217c84fb360";
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby68DCeQVtKkU3s_EJ9JuOLfA602en6YueaWepZut-hFqHu71Gh92kh_KPABJojkXJ0Vw/exec";

    let finalImageUrl = "";
    // جلب الباقة والكود من الصفحة السابقة (index.html)
    const selectedPlan = localStorage.getItem('user_selected_plan') || "لم يتم تحديد باقة";
    const referrerCode = localStorage.getItem('user_referral_code') || "بدون كود";

    function showStep(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('step' + n).classList.add('active');
    }

    function openBank(bank, rib, owner) {
        document.getElementById('b-name').innerText = bank;
        document.getElementById('b-rib').innerText = rib;
        document.getElementById('b-owner').innerText = owner;
        showStep(2);
    }

    // رفع الصورة إلى ImgBB
    async function uploadToImgBB() {
        const fileInp = document.getElementById('u-file');
        const status = document.getElementById('u-status');
        const spinner = document.getElementById('spinner');
        const btn = document.getElementById('final-btn');

        if(!fileInp.files[0]) return;

        status.innerText = "جاري الرفع...";
        spinner.style.display = "block";
        btn.disabled = true;

        const formData = new FormData();
        formData.append("image", fileInp.files[0]);

        try {
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {
                method: "POST",
                body: formData
            });
            const data = await response.json();
            finalImageUrl = data.data.url;
            
            status.innerText = "✅ تم رفع الصورة بنجاح";
            status.style.color = "green";
            spinner.style.display = "none";
            btn.disabled = false;
        } catch (error) {
            status.innerText = "❌ خطأ في الرفع، حاول ثانية";
            status.style.color = "red";
            spinner.style.display = "none";
        }
    }

    // إرسال البيانات النهائية إلى Google Sheets
    async function sendToGoogleSheets() {
        const userName = document.getElementById('u-name').value.trim();
        const btn = document.getElementById('final-btn');

        if(!userName) {
            alert("يرجى إدخال اسمك الكامل");
            return;
        }

        btn.innerText = "جاري الإرسال...";
        btn.disabled = true;

        const payload = {
            name: userName,
            plan: selectedPlan,
            refCode: referrerCode,
            receipt: finalImageUrl
        };

        try {
            // استخدام fetch لإرسال البيانات كـ POST
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", // ضرورية لتجنب مشاكل CORS مع Google Script
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            alert("تم إرسال طلبك بنجاح! سيتم مراجعته وتفعيل حسابك.");
            // مسح البيانات المحفوظة والعودة للرئيسية
            localStorage.clear();
            window.location.href = "index.html"; 
        } catch (error) {
            alert("حدث خطأ أثناء الإرسال، يرجى المحاولة لاحقاً.");
            btn.innerText = "تأكيد وإرسال الطلب";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
