<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LikCash - تأكيد الدفع</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* تنسيق الصفحة لتكون ممركزة واحترافية */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        
        .payment-card { 
            width: 100%; 
            max-width: 400px; 
            background: #fff; 
            padding: 30px; 
            border-radius: 25px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center; 
        }
        
        .step-view { display: none; animation: fadeIn 0.4s ease; }
        .step-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-size: 22px; font-weight: 800; margin-bottom: 25px; color: #333; }
        
        .bank-details-box { 
            background: #fafafa; 
            border: 1px solid #eee; 
            padding: 20px; 
            border-radius: 20px; 
            margin-bottom: 25px; 
            text-align: right; 
        }
        .bank-details-box p { font-size: 11px; color: #999; margin-bottom: 4px; }
        .bank-details-box strong { font-size: 14px; color: #222; display: block; margin-bottom: 12px; word-break: break-all; }

        input { 
            width: 100%; 
            padding: 16px; 
            border: 1.5px solid #eee; 
            border-radius: 15px; 
            outline: none; 
            margin-bottom: 20px; 
            text-align: center; 
            font-size: 16px;
            background: #fdfdfd;
        }
        input:focus { border-color: #000; background: #fff; }

        .upload-box { 
            border: 2px dashed #ddd; 
            padding: 40px 20px; 
            border-radius: 20px; 
            cursor: pointer; 
            background: #fdfdfd; 
            margin-bottom: 30px; 
            transition: 0.3s;
        }
        .upload-box:hover { border-color: #000; }
        
        .btn-main { 
            background: #000; 
            color: #fff; 
            border: none; 
            padding: 18px; 
            width: 100%; 
            border-radius: 16px; 
            font-weight: 700; 
            font-size: 17px; 
            cursor: pointer; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .btn-main:disabled { background: #ccc; box-shadow: none; }

        .spinner { 
            display: none; 
            margin: 10px auto; 
            border: 3px solid #f3f3f3; 
            border-top: 3px solid #000; 
            border-radius: 50%; 
            width: 25px; 
            height: 25px; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="payment-card">
    
    <div id="step1" class="step-view active">
        <h2>إتمام عملية الدفع</h2>
        <div class="bank-details-box">
            <p>RIB CIH BANK:</p>
            <strong>230 000 0000000000 0000 00</strong>
            <p>الاسم الكامل:</p>
            <strong>MOHAMED *******</strong>
        </div>
        <p style="font-size: 12px; color: #666; margin-bottom: 20px;">يرجى تحويل مبلغ الباقة ثم تصوير الوصل</p>
        <button class="btn-main" onclick="goToStep(2)">لقد قمت بالتحويل</button>
    </div>

    <div id="step2" class="step-view">
        <h2>تأكيد الطلب</h2>
        <input type="text" id="userNameInput" placeholder="أدخل اسمك الكامل">
        
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-cloud-upload-alt" style="font-size: 40px; color: #ccc; margin-bottom: 10px;"></i>
            <p id="uploadStatusText" style="font-size: 13px; color: #888;">إضغط لرفع صورة الوصل</p>
            <div id="loadingSpinner" class="spinner"></div>
            <input type="file" id="fileInput" hidden accept="image/*" onchange="handleFileUpload()">
        </div>

        <button class="btn-main" id="submitBtn" onclick="sendDataToSheet()" disabled>إرسال الطلب للمراجعة</button>
    </div>

</div>

<script>
    // رابط الـ Apps Script الخاص بك
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwEAFy5HdC-umchAC7XJCxPEIi0bu29FZDbAgYppkeOd4kkoluMT6D8dEQVky0Q3eyJBw/exec";
    const IMGBB_API_KEY = "1b9671dbfcf13881d735b217c84fb360";

    let uploadedImageUrl = "";
    const pendingOrderInfo = JSON.parse(localStorage.getItem('pending_order'));

    function goToStep(n) {
        document.querySelectorAll('.step-view').forEach(v => v.classList.remove('active'));
        document.getElementById('step' + n).classList.add('active');
    }

    async function handleFileUpload() {
        const file = document.getElementById('fileInput').files[0];
        if(!file) return;

        document.getElementById('loadingSpinner').style.display = "block";
        document.getElementById('uploadStatusText').innerText = "جاري رفع الصورة...";

        const formData = new FormData();
        formData.append("image", file);

        try {
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: "POST",
                body: formData
            });
            const result = await response.json();
            uploadedImageUrl = result.data.url;
            
            document.getElementById('uploadStatusText').innerText = "✅ تم رفع الوصل بنجاح";
            document.getElementById('uploadStatusText').style.color = "#2ecc71";
            document.getElementById('submitBtn').disabled = false;
        } catch (error) {
            document.getElementById('uploadStatusText').innerText = "❌ فشل الرفع، حاول مرة أخرى";
            document.getElementById('uploadStatusText').style.color = "red";
        } finally {
            document.getElementById('loadingSpinner').style.display = "none";
        }
    }

    function sendDataToSheet() {
        const name = document.getElementById('userNameInput').value.trim();
        const btn = document.getElementById('submitBtn');

        if(!name) { alert("يرجى إدخال اسمك الكامل"); return; }
        if(!pendingOrderInfo) { alert("حدث خطأ في بيانات الباقة، يرجى إعادة المحاولة من المتجر"); return; }

        btn.innerText = "جاري الحفظ...";
        btn.disabled = true;

        const dataToSend = {
            name: name,
            receipt: uploadedImageUrl,
            plan: pendingOrderInfo.planPrice,
            refCode: pendingOrderInfo.newCode
        };

        // استخدام XMLHttpRequest لتجنب مشاكل CORS
        var xhr = new XMLHttpRequest();
        xhr.open("POST", SCRIPT_URL, true);
        xhr.setRequestHeader('Content-Type', 'text/plain;charset=UTF-8');
        
        xhr.onload = function() {
            alert("✅ شكراً لك! تم إرسال طلبك بنجاح. يمكنك متابعة حالة التفعيل من صفحة باقاتي.");
            localStorage.removeItem('pending_order');
            window.location.href = "index.html"; // العودة للداشبورد
        };

        xhr.onerror = function() {
            alert("حدث خطأ أثناء الإرسال. يرجى التأكد من اتصالك بالإنترنت.");
            btn.disabled = false;
            btn.innerText = "إرسال البيانات للمراجعة";
        };

        xhr.send(JSON.stringify(dataToSend));
    }
</script>

</body>
</html>
