<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LikCash - تأكيد الطلب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
        body { background-color: #fff; display: flex; justify-content: center; padding: 20px; color: #000; }
        .payment-container { width: 100%; max-width: 400px; text-align: center; }
        
        .step { display: none; animation: fadeIn 0.3s ease; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

        h2 { font-size: 20px; font-weight: 800; margin: 25px 0; }
        .bank-card { background: #fcfcfc; border: 1px solid #eee; padding: 20px; border-radius: 20px; margin-bottom: 25px; text-align: right; }
        .bank-card p { font-size: 11px; color: #888; margin-bottom: 5px; }
        .bank-card strong { font-size: 14px; color: #000; display: block; margin-bottom: 12px; word-break: break-all; }

        input { width: 100%; padding: 16px; border: 1px solid #eee; border-radius: 14px; outline: none; margin-bottom: 15px; font-size: 15px; text-align: right; background: #fafafa; }
        input:focus { border-color: #000; background: #fff; }

        .upload-box { border: 2px dashed #eee; padding: 40px 20px; border-radius: 20px; cursor: pointer; background: #fafafa; margin-bottom: 25px; transition: 0.3s; }
        .upload-box:active { transform: scale(0.98); }
        
        .btn-black { background: #000; color: #fff; border: none; padding: 18px; width: 100%; border-radius: 16px; font-weight: 700; font-size: 16px; cursor: pointer; }
        .btn-black:disabled { background: #ccc; cursor: not-allowed; }

        .loader { display: none; margin: 10px auto; border: 3px solid #f3f3f3; border-top: 3px solid #000; border-radius: 50%; width: 22px; height: 22px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="payment-container">
    
    <div id="p-step1" class="step active">
        <h2>أرسل مبلغ الباقة للحساب</h2>
        <div class="bank-card">
            <p>اسم البنك:</p><strong>CIH BANK</strong>
            <p>رقم الحساب (RIB):</p><strong>230 000 0000000000 0000 00</strong>
            <p>اسم صاحب الحساب:</p><strong>MOHAMED *******</strong>
        </div>
        <button class="btn-black" onclick="goStep(2)">لقد قمت بالتحويل ✅</button>
    </div>

    <div id="p-step2" class="step">
        <h2>تأكيد الطلب</h2>
        <input type="text" id="full-name-input" placeholder="اسمك الكامل">
        
        <div class="upload-box" onclick="document.getElementById('receipt-file').click()">
            <i class="fas fa-cloud-upload-alt" style="font-size: 30px; color: #ddd; margin-bottom: 10px;"></i>
            <p id="up-msg" style="font-size: 13px; color: #666;">ارفع صورة الوصل (الروسي)</p>
            <div id="up-loader" class="loader"></div>
            <input type="file" id="receipt-file" hidden accept="image/*" onchange="handleUpload()">
        </div>

        <button class="btn-black" id="final-btn" onclick="submitToSheet()" disabled>إرسال البيانات للجدول</button>
    </div>

</div>

<script>
    // الرابط الجديد الخاص بك
    const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbzzDLX5R1xwhthEXXuYxYgk2xbuEAVrgNNLEaCky9t95jQy8RS6NzGeDomo7yn9sgYoNw/exec";
    const IMGBB_KEY = "1b9671dbfcf13881d735b217c84fb360";

    let finalImgUrl = "";
    const pendingOrder = JSON.parse(localStorage.getItem('pending_order'));

    function goStep(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('p-step' + n).classList.add('active');
    }

    async function handleUpload() {
        const file = document.getElementById('receipt-file').files[0];
        if(!file) return;

        document.getElementById('up-loader').style.display = "block";
        document.getElementById('up-msg').innerText = "جاري رفع الصورة...";

        const fd = new FormData();
        fd.append("image", file);

        try {
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: fd });
            const data = await res.json();
            finalImgUrl = data.data.url;
            
            document.getElementById('up-msg').innerText = "✅ تم الرفع بنجاح";
            document.getElementById('up-msg').style.color = "green";
            document.getElementById('final-btn').disabled = false;
        } catch (e) {
            document.getElementById('up-msg').innerText = "❌ فشل الرفع، حاول ثانية";
        } finally {
            document.getElementById('up-loader').style.display = "none";
        }
    }

    function submitToSheet() {
        const name = document.getElementById('full-name-input').value.trim();
        const btn = document.getElementById('final-btn');

        if(!name) { alert("أدخل اسمك أولاً"); return; }
        if(!pendingOrder) { alert("خطأ في البيانات، ابدأ من جديد"); return; }

        btn.innerText = "جاري الحفظ...";
        btn.disabled = true;

        const data = {
            name: name,
            receipt: finalImgUrl,
            plan: pendingOrder.planPrice,
            refCode: pendingOrder.newCode
        };

        var xhr = new XMLHttpRequest();
        xhr.open("POST", GOOGLE_URL, true);
        xhr.setRequestHeader('Content-Type', 'text/plain;charset=UTF-8');
        
        xhr.onload = function() {
            // حتى لو كانت هناك مشكلة في CORS، غالباً البيانات تصل
            alert("✅ تم إرسال طلبك بنجاح! \n كودك هو: " + pendingOrder.newCode);
            localStorage.removeItem('pending_order');
            window.location.href = "index.html"; 
        };

        xhr.onerror = function() {
            // محاولة أخيرة للإرسال
            alert("حدث تنبيه في الشبكة، يرجى التأكد من وصول طلبك في السجل.");
            btn.disabled = false;
        };

        xhr.send(JSON.stringify(data));
    }
</script>

</body>
</html>
