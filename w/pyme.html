<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LikCash - إتمام الدفع</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #f8f9fa; padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .pyme-card { background: #fff; width: 100%; max-width: 420px; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        .info-box { background: #fdfdfd; border: 1px dashed #ddd; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .selected-plan { font-size: 20px; font-weight: 900; color: #000; }
        .input-group { text-align: right; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; font-weight: 700; color: #444; margin-bottom: 8px; }
        input { width: 100%; padding: 14px; border: 1.5px solid #eee; border-radius: 12px; font-size: 15px; outline: none; background: #fafafa; }
        .upload-area { border: 2px dashed #eee; padding: 20px; border-radius: 15px; cursor: pointer; margin-bottom: 20px; position: relative; overflow: hidden; }
        #imgPreview { width: 100%; max-height: 200px; object-fit: contain; border-radius: 10px; display: none; margin-top: 10px; }
        .btn-confirm { background: #000; color: #fff; border: none; padding: 16px; width: 100%; border-radius: 15px; font-weight: 700; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-confirm:disabled { background: #ccc; cursor: not-allowed; }
        #statusMsg { margin-top: 15px; font-size: 13px; font-weight: 600; min-height: 20px; }
    </style>
</head>
<body>

    <div class="pyme-card">
        <h2>تأكيد الطلب</h2>
        <p style="font-size: 14px; color: #666; margin-bottom: 20px;">ارفع وصل التحويل لإتمام العملية</p>

        <div class="info-box">
            <p style="font-size: 12px; color: #888;">الباقة المختارة:</p>
            <div class="selected-plan" id="planDisplay">---</div>
        </div>

        <div class="input-group">
            <label>الاسم الكامل</label>
            <input type="text" id="custName" placeholder="محمد العلوي">
        </div>

        <div class="input-group">
            <label>وصل التحويل</label>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div id="uploadPlaceholder">
                    <i class="fas fa-camera" style="font-size: 24px; color: #aaa;"></i>
                    <p style="font-size: 12px; color: #aaa; margin-top: 5px;">اضغط لرفع صورة الوصل</p>
                </div>
                <input type="file" id="fileInput" hidden accept="image/*" onchange="handleFile(this)">
                <img id="imgPreview">
            </div>
        </div>

        <button class="btn-confirm" id="sendBtn" onclick="submitToSheet()">إرسال الطلب الآن</button>
        <div id="statusMsg"></div>
    </div>

    <script>
        // رابط النشر الجديد الخاص بك
        const API_URL = "https://script.google.com/macros/s/AKfycbwnAEBk6wsY6j4HyUZ1pkqZ8FqU8TjzR5l8HINpI4cZ536A7sP6DiYry4FaahUJ3ATtDg/exec"; 
        const IMGBB_API_KEY = "f2d9be6981c0d0877f86feaf452b22ee";
        
        const userEmail = localStorage.getItem('user_gmail');
        const selectedPrice = localStorage.getItem('selected_plan_price') || "غير محدد";

        // التحقق من وجود الإيميل
        if (!userEmail) { window.location.href = "login.html"; }
        document.getElementById('planDisplay').innerText = selectedPrice;

        let base64Img = "";

        // معالجة الملف وتحويله لـ Base64
        function handleFile(input) {
            const file = input.files[0];
            if (file) {
                if (file.size > 5 * 1024 * 1024) { 
                    alert("الصورة كبيرة جداً، يرجى اختيار صورة أقل من 5 ميجا");
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    base64Img = e.target.result;
                    document.getElementById('imgPreview').src = base64Img;
                    document.getElementById('imgPreview').style.display = "block";
                    document.getElementById('uploadPlaceholder').style.display = "none";
                };
                reader.readAsDataURL(file);
            }
        }

        async function uploadToImgBB(base64Data) {
            const formData = new FormData();
            formData.append("image", base64Data.split(",")[1]);
            
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: "POST",
                body: formData
            });
            const data = await response.json();
            if (data.success) {
                return data.data.url;
            } else {
                throw new Error("ImgBB Upload Failed");
            }
        }

        async function submitToSheet() {
            const name = document.getElementById('custName').value.trim();
            const btn = document.getElementById('sendBtn');
            const status = document.getElementById('statusMsg');

            if (!name) { alert("يرجى إدخال الاسم"); return; }
            if (!base64Img) { alert("يرجى رفع صورة الوصل"); return; }

            btn.disabled = true;
            btn.innerText = "جاري المعالجة...";
            status.style.color = "#666";
            status.innerText = "جاري إرسال البيانات ومعالجة الصورة...";

            try {
                // رفع الصورة أولاً إلى ImgBB
                const uploadedImageUrl = await uploadToImgBB(base64Img);

                const payload = {
                    name: name,
                    email: userEmail,
                    plan: selectedPrice,
                    receipt: uploadedImageUrl, 
                    refCode: "LC" + Math.floor(10000 + Math.random() * 90000)
                };

                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify(payload)
                });

                status.style.color = "green";
                status.innerText = "تم الإرسال بنجاح! جاري الانتقال للسجل...";
                
                setTimeout(() => { 
                    window.location.href = "check.html"; 
                }, 2000);

            } catch (err) {
                btn.disabled = false;
                btn.innerText = "إعادة المحاولة";
                status.style.color = "red";
                status.innerText = "حدث خطأ في الاتصال، حاول مرة أخرى.";
                console.error(err);
            }
        }
    </script>
</body>
</html>
