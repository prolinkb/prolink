<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash | إتمام الدفع</title>
    <style>
        :root { --primary: #000; --bg: #f9fafb; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 20px; text-align: center; }
        .pyme-card { background: #fff; max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        input, select { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .btn-send { background: var(--primary); color: #fff; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        #status { margin-top: 15px; font-size: 14px; }
        .preview-img { width: 100%; max-height: 200px; object-fit: contain; margin: 10px 0; display: none; }
    </style>
</head>
<body>

    <div class="pyme-card">
        <h2>إتمام الطلب</h2>
        <p style="color: #666; font-size: 14px;">يرجى رفع صورة الوصل وتأكيد المعلومات</p>
        
        <input type="text" id="userName" placeholder="الاسم الكامل">
        
        <select id="planSelect">
            <option value="50 DH">باقة 50 درهم</option>
            <option value="100 DH">باقة 100 درهم</option>
            <option value="200 DH">باقة 200 درهم</option>
        </select>

        <input type="file" id="receiptImg" accept="image/*" onchange="previewImage(event)">
        <img id="imgPreview" class="preview-img">

        <button class="btn-send" id="submitBtn" onclick="uploadAndSend()">إرسال الطلب الآن</button>
        <div id="status"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTK9DCO--kObWjqKuW54o0MXcmFCwngFHRCyd3Q4oP4eQRpCAVx4LDh7vfYRnpx4YgWQ/exec";
        
        // 1. جلب الجيميل المحفوظ من الصفحة الأولى
        const userEmail = localStorage.getItem('user_gmail');

        if (!userEmail) {
            window.location.href = "index.html";
        }

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const img = document.getElementById('imgPreview');
                img.src = reader.result;
                img.style.display = "block";
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        async function uploadAndSend() {
            const name = document.getElementById('userName').value;
            const plan = document.getElementById('planSelect').value;
            const fileInput = document.getElementById('receiptImg');
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('status');

            if (!name || !fileInput.files[0]) {
                alert("يرجى ملء الاسم ورفع صورة الوصل");
                return;
            }

            btn.disabled = true;
            btn.innerText = "جاري الإرسال...";
            status.innerText = "يتم الآن رفع الصورة ومعالجة الطلب...";

            // تحويل الصورة لـ Base64 ليرسلها لـ Apps Script
            const reader = new FileReader();
            reader.readAsDataURL(fileInput.files[0]);
            reader.onload = async () => {
                const base64Image = reader.result;
                
                // توليد كود مرجع عشوائي
                const refCode = "REF-" + Math.floor(Math.random() * 1000000);

                const payload = {
                    name: name,
                    email: userEmail, // الجيميل كيدوز أوتوماتيكياً هنا
                    plan: plan,
                    refCode: refCode,
                    receipt: base64Image // الصورة غاتمشي ككود لـ Apps Script
                };

                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();

                    if (result.result === "SUCCESS") {
                        status.style.color = "green";
                        status.innerText = "تم إرسال طلبك بنجاح!";
                        setTimeout(() => {
                            window.location.href = "w/check.html"; // الرجوع للداشبورد
                        }, 1500);
                    } else {
                        throw new Error();
                    }
                } catch (err) {
                    btn.disabled = false;
                    btn.innerText = "إرسال الطلب الآن";
                    status.style.color = "red";
                    status.innerText = "حدث خطأ في الإرسال، حاول مرة أخرى.";
                }
            };
        }
    </script>
</body>
</html>
