<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LikCash - إتمام الدفع</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
        body { background-color: #ffffff; padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #000; }
        .pyme-card { background: #fff; width: 100%; max-width: 400px; padding: 25px; border-radius: 20px; text-align: center; }
        h2 { font-weight: 800; font-size: 24px; margin-bottom: 10px; }
        .info-box { background: #f9f9f9; padding: 15px; border-radius: 15px; margin-bottom: 25px; border: 1px solid #eee; }
        .selected-plan { font-size: 22px; font-weight: 900; color: #000; }
        .input-group { text-align: right; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 14px; font-weight: 700; color: #333; margin-bottom: 8px; }
        input { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; outline: none; background: #fff; transition: 0.3s; }
        input:focus { border-color: #000; }
        .upload-area { border: 2px dashed #ccc; padding: 25px; border-radius: 15px; cursor: pointer; margin-bottom: 25px; position: relative; background: #fafafa; }
        #imgPreview { width: 100%; max-height: 200px; object-fit: contain; border-radius: 10px; display: none; margin-top: 10px; }
        .btn-confirm { background: #000; color: #fff; border: none; padding: 18px; width: 100%; border-radius: 15px; font-weight: 700; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-confirm:disabled { background: #666; cursor: not-allowed; opacity: 0.7; }
        #statusMsg { margin-top: 15px; font-size: 13px; font-weight: 600; min-height: 20px; }
    </style>
</head>
<body>

    <div class="pyme-card">
        <h2>تأكيد الطلب</h2>
        <p style="font-size: 14px; color: #666; margin-bottom: 25px;">ارفع وصل التحويل لإتمام العملية</p>

        <div class="info-box">
            <p style="font-size: 12px; color: #888;">الباقة المختارة:</p>
            <div class="selected-plan" id="planDisplay">---</div>
            <div style="font-size: 11px; margin-top: 5px; color: #555;">كود الإحالة: <span id="refDisplay" style="font-weight:700;">---</span></div>
        </div>

        <div class="input-group">
            <label>الاسم الكامل</label>
            <input type="text" id="custName" placeholder="مثال: محمد العلوي">
        </div>

        <div class="input-group">
            <label>وصل التحويل</label>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div id="uploadPlaceholder">
                    <i class="fas fa-camera" style="font-size: 28px; color: #000;"></i>
                    <p style="font-size: 13px; color: #555; margin-top: 8px;">اضغط لرفع صورة الوصل</p>
                </div>
                <input type="file" id="fileInput" hidden accept="image/*" onchange="handleFile(this)">
                <img id="imgPreview">
            </div>
        </div>

        <button class="btn-confirm" id="sendBtn" onclick="submitToSheet()">إرسال الطلب الآن</button>
        <div id="statusMsg"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxH9KvmmRBmHgBImHhsTuFGGAWYuXS0EblHJG6OpcgPVv14K22gXMDz6EDwcrH3vZTT_Q/exec";
        const IMGBB_API_KEY = "f2d9be6981c0d0877f86feaf452b22ee";
        
        const userEmail = localStorage.getItem('user_gmail');
        const selectedPrice = localStorage.getItem('selected_plan_price') || "غير محدد";
        const finalRef = localStorage.getItem('final_ref_code') || "نوريفيرايت";

        if (!userEmail) { window.location.href = "index.html"; }
        document.getElementById('planDisplay').innerText = selectedPrice + " MAD";
        document.getElementById('refDisplay').innerText = finalRef;

        let base64Img = "";

        function handleFile(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    base64Img = e.target.result;
                    document.getElementById('imgPreview').src = base64Img;
                    document.getElementById('imgPreview').style.display = "block";
                    document.getElementById('uploadPlaceholder').style.display = "none";
                };
                reader.readAsDataURL(file);
            }
        }

        async function uploadToImgBB(base64Data) {
            const formData = new FormData();
            formData.append("image", base64Data.split(",")[1]);
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: "POST",
                body: formData
            });
            const data = await response.json();
            return data.success ? data.data.url : null;
        }

        async function submitToSheet() {
            const name = document.getElementById('custName').value.trim();
            const btn = document.getElementById('sendBtn');
            const status = document.getElementById('statusMsg');

            if (!name || !base64Img) { alert("يرجى إكمال البيانات"); return; }

            btn.disabled = true;
            btn.innerText = "جاري الإرسال...";
            status.innerText = "جاري معالجة الطلب...";

            try {
                const uploadedImageUrl = await uploadToImgBB(base64Img);
                const payload = {
                    name: name,
                    email: userEmail,
                    plan: selectedPrice,
                    receipt: uploadedImageUrl, 
                    refCode: "LC" + Math.floor(10000 + Math.random() * 90000),
                    enteredCode: finalRef
                };

                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });

                status.style.color = "green";
                status.innerText = "تم الإرسال بنجاح!";
                setTimeout(() => { window.location.href = "check.html"; }, 2000);
            } catch (err) {
                btn.disabled = false;
                btn.innerText = "إعادة المحاولة";
                status.style.color = "red";
                status.innerText = "خطأ في الإرسال.";
            }
        }
    </script>
</body>
</html>
