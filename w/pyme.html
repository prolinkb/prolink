<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تأكيد الطلب - LikCash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #fff; display: flex; justify-content: center; padding: 20px; }
        .payment-container { width: 100%; max-width: 400px; text-align: center; }
        
        h2 { font-size: 18px; font-weight: 800; margin: 20px 0; }
        input { width: 100%; padding: 15px; border: 1px solid #eee; border-radius: 14px; outline: none; margin-bottom: 15px; text-align: right; font-size: 14px; }
        
        .upload-box { border: 2px dashed #eee; padding: 40px 20px; border-radius: 20px; cursor: pointer; background: #fafafa; margin-bottom: 25px; }
        .upload-box i { font-size: 30px; color: #ddd; }
        
        .btn-black { background: #000; color: #fff; border: none; padding: 16px; width: 100%; border-radius: 14px; font-weight: 700; cursor: pointer; font-size: 15px; }
        .btn-black:disabled { background: #ccc; cursor: not-allowed; }

        .loader { display: none; margin: 10px auto; border: 3px solid #f3f3f3; border-top: 3px solid #000; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="payment-container">
    <h2>تأكيد الطلب وإرسال الوصل</h2>
    
    <input type="text" id="user-fullname" placeholder="اسمك الكامل (بالفرنسية)">
    
    <div class="upload-box" onclick="document.getElementById('file-input').click()">
        <i class="fas fa-file-upload"></i>
        <p id="upload-status" style="font-size: 12px; color: #888; margin-top: 10px;">اضغط لرفع صورة الوصل</p>
        <div id="loader" class="loader"></div>
        <input type="file" id="file-input" hidden accept="image/*" onchange="uploadToImgBB()">
    </div>

    <button class="btn-black" id="submit-btn" onclick="sendToSheet()" disabled>إرسال البيانات للجدول</button>
</div>

<script>
    // الإعدادات
    const IMGBB_API = "1b9671dbfcf13881d735b217c84fb360";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyg-EyRKi62rwAAldVdFtc8Bssxi-4L9aainCgkAI17VVFqiFt_kVzi7FLL0pDxqqX-DQ/exec";

    let uploadedImageUrl = "";
    const orderInfo = JSON.parse(localStorage.getItem('pending_order'));

    // 1. رفع الصورة لـ ImgBB
    async function uploadToImgBB() {
        const file = document.getElementById('file-input').files[0];
        const statusText = document.getElementById('upload-status');
        const loader = document.getElementById('loader');
        const btn = document.getElementById('submit-btn');

        if(!file) return;

        statusText.innerText = "جاري الرفع...";
        loader.style.display = "block";
        
        const formData = new FormData();
        formData.append("image", file);

        try {
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API}`, {
                method: "POST",
                body: formData
            });
            const result = await response.json();
            uploadedImageUrl = result.data.url;
            
            statusText.innerText = "✅ تم رفع الوصل";
            statusText.style.color = "green";
            loader.style.display = "none";
            btn.disabled = false; // تفعيل البطون بعد الرفع
        } catch (e) {
            statusText.innerText = "❌ فشل الرفع، حاول مرة أخرى";
            loader.style.display = "none";
        }
    }

    // 2. إرسال كولشي لـ Google Sheets
    function sendToSheet() {
        const name = document.getElementById('user-fullname').value.trim();
        const btn = document.getElementById('submit-btn');

        if(!name) { alert("من فضلك أدخل اسمك الكامل"); return; }
        if(!orderInfo) { alert("خطأ في بيانات الباقة"); return; }

        btn.innerText = "جاري الإرسال...";
        btn.disabled = true;

        const payload = {
            name: name,
            receipt: uploadedImageUrl,
            plan: orderInfo.planPrice,
            refCode: orderInfo.newCode
        };

        // استعمال XMLHttpRequest مع text/plain لتفادي خطأ الاتصال
        const xhr = new XMLHttpRequest();
        xhr.open("POST", SCRIPT_URL, true);
        xhr.setRequestHeader('Content-Type', 'text/plain;charset=UTF-8');

        xhr.onload = function() {
            alert("✅ تم الإرسال بنجاح! كودك هو: " + orderInfo.newCode);
            localStorage.removeItem('pending_order');
            window.location.href = "index.html"; 
        };

        xhr.onerror = function() {
            alert("❌ حدث خطأ في الاتصال. تأكد من نشر السكريبت كـ Nouvelle Version.");
            btn.disabled = false;
            btn.innerText = "إعادة المحاولة";
        };

        xhr.send(JSON.stringify(payload));
    }
</script>

</body>
</html>
