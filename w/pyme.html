<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LikCash - إتمام الدفع</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #f8f9fa; padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .pyme-card { background: #fff; width: 100%; max-width: 420px; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        .info-box { background: #fdfdfd; border: 1px dashed #ddd; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .selected-plan { font-size: 20px; font-weight: 900; color: #000; }
        .input-group { text-align: right; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; font-weight: 700; color: #444; margin-bottom: 8px; }
        input { width: 100%; padding: 14px; border: 1.5px solid #eee; border-radius: 12px; font-size: 15px; outline: none; background: #fafafa; }
        .upload-area { border: 2px dashed #eee; padding: 20px; border-radius: 15px; cursor: pointer; margin-bottom: 20px; position: relative; }
        #imgPreview { width: 100%; max-height: 200px; object-fit: contain; border-radius: 10px; display: none; margin-top: 10px; }
        .btn-confirm { background: #000; color: #fff; border: none; padding: 16px; width: 100%; border-radius: 15px; font-weight: 700; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-confirm:disabled { background: #ccc; cursor: not-allowed; }
        #statusMsg { margin-top: 15px; font-size: 13px; font-weight: 600; }
        
        /* شاشة التحميل مثل الموقع الآخر */
        #loadingScreen { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); z-index:9999; justify-content:center; align-items:center; flex-direction:column; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #000; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <div class="spinner"></div>
        <p style="margin-top:15px; font-weight:bold;">جاري معالجة الطلب...</p>
    </div>

    <div class="pyme-card">
        <h2>تأكيد الدفع</h2>
        <p style="font-size: 14px; color: #666; margin-bottom: 20px;">ارفع الوصل لتفعيل باقتك</p>

        <div class="info-box">
            <p style="font-size: 12px; color: #888;">المبلغ المطلوب:</p>
            <div class="selected-plan" id="planDisplay">---</div>
        </div>

        <div class="input-group">
            <label>الاسم الكامل</label>
            <input type="text" id="custName" placeholder="إسمك بالكامل">
        </div>

        <div class="input-group">
            <label>صورة الوصل</label>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div id="uploadPlaceholder">
                    <i class="fas fa-camera" style="font-size: 24px; color: #aaa;"></i>
                    <p style="font-size: 12px; color: #aaa; margin-top: 5px;">إضغط هنا لرفع الصورة</p>
                </div>
                <input type="file" id="fileInput" hidden accept="image/*" onchange="handleFile(this)">
                <img id="imgPreview">
            </div>
        </div>

        <button class="btn-confirm" id="submitBtn" onclick="sendData()">تأكيد العملية</button>
        <div id="statusMsg"></div>
    </div>

    <script>
        // رابط النشر الجديد الخاص بك
        const API_URL = "https://script.google.com/macros/s/AKfycbxcIgx99j-8QzW2HZFiGT0qA0Cl_xEXtgpkXkisfbSblxzXT6O-c3ZuvV-urgY-qLA2FA/exec"; 
        
        const userEmail = localStorage.getItem('user_gmail') || "no-email";
        const selectedPrice = localStorage.getItem('selected_plan_price') || "0 MAD";

        document.getElementById('planDisplay').innerText = selectedPrice;

        let base64Img = "";

        function handleFile(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    base64Img = e.target.result;
                    document.getElementById('imgPreview').src = base64Img;
                    document.getElementById('imgPreview').style.display = "block";
                    document.getElementById('uploadPlaceholder').style.display = "none";
                };
                reader.readAsDataURL(file);
            }
        }

        async function sendData() {
            const name = document.getElementById('custName').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const loadingScreen = document.getElementById('loadingScreen');

            if (!name || !base64Img) {
                alert("يرجى ملء الاسم ورفع صورة الوصل");
                return;
            }

            submitBtn.disabled = true;
            loadingScreen.style.display = "flex";

            try {
                // استخدام URLSearchParams لإرسال البيانات بطريقة منظمة (مثل الموقع الآخر)
                const formData = new URLSearchParams();
                formData.append('fullname', name);
                formData.append('amount', selectedPrice);
                formData.append('email', userEmail);
                formData.append('imageBase64', base64Img); // إرسال الصورة كـ Parameter

                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
                    },
                    body: formData.toString()
                });

                // توجيه المستخدم لصفحة السجل فور النجاح
                window.location.replace("check.html");

            } catch (err) {
                console.error(err);
                alert("حدث خطأ، حاول مرة أخرى");
                submitBtn.disabled = false;
                loadingScreen.style.display = "none";
            }
        }
    </script>
</body>
</html>
