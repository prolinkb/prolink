<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LikCash - تأكيد الطلب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #fff; display: flex; justify-content: center; padding: 20px; }
        .payment-container { width: 100%; max-width: 400px; text-align: center; padding-top: 20px; }
        
        .step { display: none; animation: fadeIn 0.3s ease; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h2 { font-size: 19px; font-weight: 800; margin-bottom: 20px; }
        .bank-info { background: #f9f9f9; border: 1px solid #eee; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: right; }
        .bank-info strong { display: block; margin-bottom: 10px; color: #000; word-break: break-all; }
        
        .btn-black { background: #000; color: #fff; border: none; padding: 16px; width: 100%; border-radius: 12px; font-weight: 700; cursor: pointer; }
        .btn-black:disabled { background: #ccc; }

        input { width: 100%; padding: 15px; border: 1px solid #eee; border-radius: 12px; margin-bottom: 15px; text-align: right; outline: none; }
        .upload-box { border: 2px dashed #eee; padding: 40px; border-radius: 15px; cursor: pointer; background: #fafafa; margin-bottom: 20px; }
        
        .loader { display: none; margin: 10px auto; border: 3px solid #f3f3f3; border-top: 3px solid #000; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="payment-container">
    
    <div id="p-step1" class="step active">
        <h2>معلومات الدفع</h2>
        <div class="bank-info">
            <p style="font-size:11px; color:#888;">RIB CIH BANK:</p>
            <strong>230 000 0000000000 0000 00</strong>
            <p style="font-size:11px; color:#888;">الاسم:</p>
            <strong>MOHAMED *******</strong>
        </div>
        <button class="btn-black" onclick="nextStep(2)">لقد قمت بالتحويل</button>
    </div>

    <div id="p-step2" class="step">
        <h2>تأكيد البيانات</h2>
        <input type="text" id="user-full-name" placeholder="أدخل اسمك الكامل">
        
        <div class="upload-box" onclick="document.getElementById('file-input').click()">
            <i class="fas fa-camera" style="font-size: 30px; color: #ccc;"></i>
            <p id="upload-status" style="font-size: 12px; color: #999; margin-top: 10px;">ارفع صورة الوصل</p>
            <div id="loader" class="loader"></div>
            <input type="file" id="file-input" hidden accept="image/*" onchange="uploadToImgBB()">
        </div>

        <button class="btn-black" id="submit-btn" onclick="sendToSheet()" disabled>إرسال الطلب</button>
    </div>

</div>

<script>
    const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbwDbt7XjR5EMUcG6abhRrIle2L7nhLD4a5hCe3I4wKxF5p4IgqDRgERc38CLdMxbZfK-Q/exec";
    const IMGBB_KEY = "1b9671dbfcf13881d735b217c84fb360";

    let finalImg = "";
    const orderInfo = JSON.parse(localStorage.getItem('pending_order'));

    function nextStep(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('p-step' + n).classList.add('active');
    }

    async function uploadToImgBB() {
        const file = document.getElementById('file-input').files[0];
        if(!file) return;

        document.getElementById('loader').style.display = "block";
        document.getElementById('upload-status').innerText = "جاري الرفع...";

        const fd = new FormData();
        fd.append("image", file);

        try {
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: fd });
            const data = await res.json();
            finalImg = data.data.url;
            document.getElementById('upload-status').innerText = "✅ تم رفع الوصل";
            document.getElementById('submit-btn').disabled = false;
        } catch (e) {
            alert("خطأ في رفع الصورة");
        } finally {
            document.getElementById('loader').style.display = "none";
        }
    }

    function sendToSheet() {
        const name = document.getElementById('user-full-name').value.trim();
        const btn = document.getElementById('submit-btn');

        if(!name) { alert("اكتب اسمك أولاً"); return; }
        
        btn.innerText = "جاري الإرسال...";
        btn.disabled = true;

        const payload = {
            name: name,
            receipt: finalImg,
            plan: orderInfo.planPrice,
            refCode: orderInfo.newCode
        };

        var xhr = new XMLHttpRequest();
        xhr.open("POST", GOOGLE_URL, true);
        xhr.setRequestHeader('Content-Type', 'text/plain;charset=UTF-8');
        
        xhr.onload = function() {
            alert("✅ تم إرسال طلبك! الكود الخاص بك هو: " + orderInfo.newCode);
            localStorage.removeItem('pending_order');
            window.location.href = "index.html"; 
        };

        xhr.onerror = function() {
            alert("خطأ في الاتصال بالسيرفر");
            btn.disabled = false;
            btn.innerText = "إرسال الطلب";
        };

        xhr.send(JSON.stringify(payload));
    }
</script>

</body>
</html>
