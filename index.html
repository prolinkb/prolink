<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash | Authentification</title>
    <style>
        :root { 
            --primary: #000000; 
            --text-main: #1a1a1b;
            --text-secondary: #6b7280;
            --error: #d93025; 
            --success: #1e8e3e;
            --border: #e5e7eb; 
            --bg-body: #f9fafb;
            --logo-gold: #c5a059; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { background-color: var(--bg-body); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .auth-card { 
            width: 100%; 
            max-width: 420px; 
            padding: 40px 30px; 
            background: white;
            border: 1px solid var(--border); 
            border-radius: 20px; 
            text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.03); 
        }

        .logo-text {
            font-size: 36px;
            font-weight: 700;
            color: var(--logo-gold);
            margin-bottom: 10px;
            font-family: "Georgia", serif;
            letter-spacing: -1px;
        }

        .header-section { margin-bottom: 30px; }
        .header-section h1 { font-size: 24px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
        .header-section p { font-size: 14px; color: var(--text-secondary); }

        .form-section { display: none; flex-direction: column; gap: 18px; text-align: left; }
        .form-section.active { display: flex; }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-left: 2px; }
        
        input { 
            width: 100%; 
            padding: 14px 16px; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            font-size: 15px; 
            outline: none; 
            transition: 0.2s; 
            background: #fff;
            text-align: left; /* الحقول كتبقى يسار باش تناسب الايميل */
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0,0,0,0.05); }
        
        .btn-submit { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 10px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: 0.3s;
        }
        .btn-submit:hover { opacity: 0.85; }
        
        .divider { margin: 25px 0; display: flex; align-items: center; color: var(--text-secondary); font-size: 12px; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); margin: 0 15px; }
        
        .btn-social { 
            width: 100%; 
            padding: 13px; 
            background: white; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 14px;
            color: var(--text-main);
            transition: 0.2s;
        }
        .btn-social:hover { background: #f9fafb; }

        .footer-text { margin-top: 25px; font-size: 14px; color: var(--text-secondary); }
        .footer-text span { color: #5c59f2; cursor: pointer; font-weight: 600; }
        
        #status { margin-top: 15px; font-size: 13px; font-weight: 600; min-height: 20px; direction: rtl; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="logo-text">LikCash</div>

        <!-- هاد العناوين كتبدل على حسب واش تسجيل دخول أو إنشاء حساب -->
        <div id="header-login" class="header-section">
            <h1>Sign in to your account</h1>
            <p>Welcome back! Please enter your details.</p>
        </div>

        <div id="header-signup" class="header-section" style="display: none;">
            <h1>Create your account</h1>
            <p>Get started by creating your account.</p>
        </div>

        <!-- فورم تسجيل الدخول -->
        <div id="form-login" class="form-section active">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="l-email" placeholder="johndoe@mail.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="l-pass" placeholder="••••••••">
            </div>
            <button class="btn-submit" onclick="executeAuth('Manual-Login')">Sign In</button>
        </div>

        <!-- فورم إنشاء حساب -->
        <div id="form-signup" class="form-section">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="s-name" placeholder="John Doe">
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="s-email" placeholder="johndoe@mail.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="s-pass" placeholder="••••••••">
            </div>
            <button class="btn-submit" onclick="executeAuth('Manual-Signup')">Sign Up</button>
        </div>

        <div class="divider">أو</div>

        <button class="btn-social" id="google-signin">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
            Continue avec Google
        </button>

        <div class="footer-text" id="toggle-text">
            Don't have an account? <span onclick="switchTab('signup')">Sign Up</span>
        </div>

        <div id="status"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // معلومات Firebase ديالك بقات محفوضة
        const firebaseConfig = {
            apiKey: "AIzaSyBP77A_0dc3Z1H6jrUmhtapLF1w0Gbe4B8",
            authDomain: "likcash-auth.firebaseapp.com",
            projectId: "likcash-auth",
            storageBucket: "likcash-auth.firebasestorage.app",
            messagingSenderId: "19126222896",
            appId: "1:19126222896:web:0a6416948afa024e53adf5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const scriptURL = 'https://script.google.com/macros/s/AKfycbxf89GX0Uct9WujppeQKEIPdxiEHgJpCXpQfsL1i0uBlu79yYz46kG8ELiXTOdhaQ5Jmg/exec';
        const statusBox = document.getElementById('status');

        window.switchTab = (mode) => {
            const isLogin = mode === 'login';
            document.getElementById('form-login').classList.toggle('active', isLogin);
            document.getElementById('form-signup').classList.toggle('active', !isLogin);
            document.getElementById('header-login').style.display = isLogin ? 'block' : 'none';
            document.getElementById('header-signup').style.display = isLogin ? 'none' : 'block';
            
            const footer = document.getElementById('toggle-text');
            if(isLogin) {
                footer.innerHTML = `Don't have an account? <span onclick="switchTab('signup')">Sign Up</span>`;
            } else {
                footer.innerHTML = `Already have an account? <span onclick="switchTab('login')">Login</span>`;
            }
            statusBox.innerText = "";
        };

        async function apiCall(params) {
            return new Promise((resolve) => {
                const cb = 'cb_' + Math.floor(Math.random() * 1000000);
                const script = document.createElement('script');
                window[cb] = (data) => {
                    document.body.removeChild(script);
                    delete window[cb];
                    resolve(data.result);
                };
                const qs = new URLSearchParams({ callback: cb, ...params }).toString();
                script.src = `${scriptURL}?${qs}`;
                document.body.appendChild(script);
            });
        }

        window.executeAuth = async (method) => {
            const isLogin = method === 'Manual-Login';
            const email = (isLogin ? document.getElementById('l-email').value : document.getElementById('s-email').value).toLowerCase().trim();
            const pass = isLogin ? document.getElementById('l-pass').value : document.getElementById('s-pass').value;
            const name = isLogin ? "" : document.getElementById('s-name').value;

            if (!email || !pass) { 
                statusBox.innerText = "يرجى ملء كافة البيانات"; 
                statusBox.style.color = "var(--error)"; 
                return; 
            }

            statusBox.innerText = "جاري التحقق..."; 
            statusBox.style.color = "var(--text-main)";

            const response = await apiCall({ email, password: pass, name, method });

            if (response === "SUCCESS") {
                statusBox.innerText = "تم بنجاح! جاري التوجيه...";
                statusBox.style.color = "var(--success)";
                setTimeout(() => { window.location.href = "w/check.html"; }, 800);
            } else if (response === "ALREADY_EXISTS") {
                statusBox.innerText = "هذا البريد مسجل مسبقاً!";
                statusBox.style.color = "var(--error)";
            } else if (response === "WRONG_PASS") {
                statusBox.innerText = "كلمة المرور غير صحيحة!";
                statusBox.style.color = "var(--error)";
            } else if (response === "NOT_FOUND") {
                statusBox.innerText = "الحساب غير موجود، يرجى التسجيل.";
                statusBox.style.color = "orange";
            } else {
                statusBox.innerText = "حدث خطأ، حاول مرة أخرى.";
                statusBox.style.color = "var(--error)";
            }
        };

        document.getElementById('google-signin').onclick = async () => {
            try {
                statusBox.innerText = "جاري الاتصال بـ Google...";
                statusBox.style.color = "var(--text-main)";
                await signInWithPopup(auth, provider);
                window.location.href = "w/check.html"; 
            } catch (error) {
                statusBox.innerText = "فشل تسجيل الدخول بـ Google";
                statusBox.style.color = "var(--error)";
            }
        };
    </script>
</body>
</html>
