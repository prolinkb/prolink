<!DOCTYPE html> 
<html lang="fr" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash | Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f8fafc; }
        .input-field { background: #ffffff; border: 2px solid #e2e8f0; transition: all 0.3s ease; font-weight: 900; text-align: left; }
        .input-field:focus { border-color: #2563eb; outline: none; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        .loader { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        * { font-weight: 900 !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-[2.5rem] p-10 shadow-2xl border border-slate-100 text-center">
        <img src="https://i.postimg.cc/zffZkRtk/31998-removebg-preview.png" alt="LikCash" class="h-10 mx-auto mb-8">
        
        <h2 class="text-2xl text-blue-600 mb-8 italic uppercase text-center">Connexion</h2>

        <form onsubmit="handleLogin(event)" class="space-y-4 text-right">
            <div class="space-y-1">
                <label class="text-[10px] text-slate-400 mr-2 uppercase">Email</label>
                <input type="email" id="uEmail" placeholder="mail@example.com" class="input-field w-full px-5 py-4 rounded-2xl font-sans" required>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] text-slate-400 mr-2 uppercase">Mot de passe</label>
                <input type="password" id="uPass" placeholder="••••••••" class="input-field w-full px-5 py-4 rounded-2xl" required>
            </div>
            
            <button type="submit" id="mainBtn" class="w-full bg-slate-900 text-white py-5 rounded-2xl text-lg flex items-center justify-center gap-3 hover:bg-blue-600 transition-all shadow-xl mt-4">
                <span id="btnText">SE CONNECTER</span>
                <div id="btnLoader" class="loader"></div>
            </button>
        </form>

        <div class="relative my-8 flex items-center justify-center">
            <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-100"></span></div>
            <span class="relative bg-white px-4 text-slate-400 text-[10px] font-bold italic uppercase">Ou</span>
        </div>

        <button onclick="loginGoogle()" class="flex items-center justify-center gap-3 w-full border-2 border-slate-100 py-4 rounded-2xl hover:bg-slate-50 transition-all">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5">
            <span class="text-[11px] font-black uppercase text-slate-700">Google Account</span>
        </button>
    </div>

    <script>
        // الرابط اللي عطيتيني
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbybX-_C3QCchPtomRm0BOsOXjSxxcPFs1tLWA2A3F-5vKyZ_6htnBggbFbHDN3K-Atg0g/exec";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBP77A_0dc3Z1H6jrUmhtapLF1w0Gbe4B8",
            authDomain: "likcash-auth.firebaseapp.com",
            projectId: "likcash-auth",
            storageBucket: "likcash-auth.firebasestorage.app",
            messagingSenderId: "19126222896",
            appId: "1:19126222896:web:0a6416948afa024e53adf5"
        };
        firebase.initializeApp(firebaseConfig);

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('uEmail').value.trim();
            const pass = document.getElementById('uPass').value.trim();

            // اللودر
            document.getElementById('btnText').style.display = "none";
            document.getElementById('btnLoader').style.display = "block";

            try {
                // 1. التحقق من السكربت (loginCheck)
                const response = await fetch(`${SCRIPT_URL}?action=loginCheck&email=${encodeURIComponent(email)}&pass=${encodeURIComponent(pass)}`);
                const result = await response.text();

                if (result === "FOUND") {
                    // 2. نجاح: تسجيل البصمة والتوجيه
                    sessionStorage.setItem('isAuth', 'true');
                    sessionStorage.setItem('userEmail', email);
                    window.location.href = "w/check.html";
                } else {
                    alert("Email ou Mot de passe incorrect !");
                    resetBtn();
                }
            } catch (err) {
                alert("Erreur de connexion au serveur.");
                resetBtn();
            }
        }

        async function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const res = await firebase.auth().signInWithPopup(provider);
                const user = res.user;

                // إرسال البيانات للجدول (saveData)
                fetch(`${SCRIPT_URL}?action=saveData&email=${encodeURIComponent(user.email)}&name=${encodeURIComponent(user.displayName)}&pass=GOOGLE_AUTH`, { mode: 'no-cors' });

                sessionStorage.setItem('isAuth', 'true');
                sessionStorage.setItem('userEmail', user.email);
                
                setTimeout(() => {
                    window.location.href = "w/check.html";
                }, 800);
            } catch (err) { alert("Erreur Google Auth"); }
        }

        function resetBtn() {
            document.getElementById('btnText').style.display = "block";
            document.getElementById('btnLoader').style.display = "none";
        }
    </script>
</body>
</html>
