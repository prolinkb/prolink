<!DOCTYPE html> 
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash | المنصة المالية الاحترافية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Tajawal', sans-serif; background: #fdfdfd; color: #0f172a; overflow-x: hidden; }
        
        /* Dynamic Island - iPhone 14 Pro Style */
        .dynamic-island {
            width: 170px; height: 35px; background: #000; border-radius: 50px;
            margin: 20px auto; display: flex; align-items: center; justify-content: center;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            position: sticky; top: 15px; z-index: 1000;
        }
        .dynamic-island:hover { width: 280px; height: 50px; }
        .logo-island { height: 18px; filter: brightness(0) invert(1); }

        .premium-card {
            background: white; border-radius: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0,0,0,0.03);
        }

        .loader {
            width: 22px; height: 22px; border: 3px solid #FFF;
            border-bottom-color: transparent; border-radius: 50%;
            display: inline-block; animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg) } 100% { transform: rotate(360deg) } }
        
        .hidden-item { display: none; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="dynamic-island shadow-2xl">
        <img src="https://i.postimg.cc/zffZkRtk/31998-removebg-preview.png" class="logo-island" alt="LikCash">
    </div>

    <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-16 items-center mt-12">
        
        <div class="text-right space-y-8 animate-fade-in">
            <h1 class="text-5xl font-900 text-slate-900 leading-[1.2]">إدارة أموالك أصبحت <span class="text-blue-600 underline decoration-blue-200">أذكى</span> مع LikCash</h1>
            <p class="text-slate-500 text-xl leading-relaxed">
                المنصة الأولى في المغرب التي تجمع بين البساطة والأمان المطلق. استلم، أرسل، وراقب ميزانيتك في مكان واحد.
            </p>
            
            <div class="flex gap-4">
                <div class="bg-blue-50 p-4 rounded-2xl flex items-center gap-3">
                    <span class="text-2xl">🔒</span>
                    <span class="font-bold text-blue-900 text-sm">أمان مشفر</span>
                </div>
                <div class="bg-green-50 p-4 rounded-2xl flex items-center gap-3">
                    <span class="text-2xl">⚡</span>
                    <span class="font-bold text-green-900 text-sm">إيداع فوري</span>
                </div>
            </div>
        </div>

        <div class="premium-card p-10 md:p-12">
            <div class="flex gap-10 mb-12 border-b border-slate-50">
                <button onclick="setTab('login')" id="btnTabLogin" class="text-xl font-900 text-blue-600 border-b-4 border-blue-600 pb-3 transition-all">دخول</button>
                <button onclick="setTab('signup')" id="btnTabSignup" class="text-xl font-900 text-slate-300 pb-3 transition-all">فتح حساب</button>
            </div>

            <form id="mainForm" class="space-y-6">
                <div id="groupName" class="hidden-item">
                    <label class="block text-xs font-900 text-slate-400 mr-2 mb-2 uppercase tracking-widest">الإسم الكامل</label>
                    <input type="text" id="uName" placeholder="الإسم الكامل" class="w-full px-6 py-5 rounded-2xl bg-slate-50 border-none outline-none focus:ring-2 ring-blue-500 font-bold transition-all">
                </div>

                <div>
                    <label class="block text-xs font-900 text-slate-400 mr-2 mb-2 uppercase tracking-widest">البريد الإلكتروني</label>
                    <input type="email" id="uEmail" placeholder="mail@example.com" required class="w-full px-6 py-5 rounded-2xl bg-slate-50 border-none outline-none focus:ring-2 ring-blue-500 font-bold transition-all text-left">
                </div>

                <div>
                    <label class="block text-xs font-900 text-slate-400 mr-2 mb-2 uppercase tracking-widest">كلمة المرور</label>
                    <input type="password" id="uPass" placeholder="••••••••" required class="w-full px-6 py-5 rounded-2xl bg-slate-50 border-none outline-none focus:ring-2 ring-blue-500 font-bold transition-all text-left">
                </div>

                <button type="submit" id="btnSubmit" class="w-full bg-slate-950 text-white py-5 rounded-3xl font-900 text-lg shadow-2xl hover:bg-blue-600 active:scale-95 transition-all flex items-center justify-center gap-4">
                    <span id="labelSubmit">تسجيل الدخول</span>
                    <span id="loaderSubmit" class="loader hidden-item"></span>
                </button>
            </form>

            <div class="relative my-10 flex items-center">
                <div class="flex-grow border-t border-slate-100"></div>
                <span class="px-6 text-slate-400 text-[11px] font-bold uppercase tracking-[0.2em]">أو</span>
                <div class="flex-grow border-t border-slate-100"></div>
            </div>

            <button onclick="handleGoogle()" class="w-full flex items-center justify-center gap-4 border-2 border-slate-50 py-5 rounded-3xl hover:bg-slate-50 transition-all font-bold group">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6">
                <span class="text-slate-700 group-hover:text-blue-600">المتابعة عبر جوجل</span>
            </button>
        </div>
    </div>

    <script>
        // --- الرابط الجديد الخاص بك ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQjz6CjRJTfo9TiNO5R303eL_t6WikMxDG60EplfI1JIZ_6NF_M4PnKTTQ53JRSQbKBQ/exec";

        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyBP77A_0dc3Z1H6jrUmhtapLF1w0Gbe4B8",
            authDomain: "likcash-auth.firebaseapp.com",
            projectId: "likcash-auth",
            storageBucket: "likcash-auth.firebasestorage.app",
            messagingSenderId: "19126222896",
            appId: "1:19126222896:web:0a6416948afa024e53adf5"
        };
        firebase.initializeApp(firebaseConfig);

        let activeMode = 'login';

        function setTab(mode) {
            activeMode = mode;
            const groupName = document.getElementById('groupName');
            const labelSubmit = document.getElementById('labelSubmit');
            const btnLogin = document.getElementById('btnTabLogin');
            const btnSignup = document.getElementById('btnTabSignup');

            if(mode === 'signup') {
                groupName.classList.remove('hidden-item');
                btnSignup.className = "text-xl font-900 text-blue-600 border-b-4 border-blue-600 pb-3 transition-all";
                btnLogin.className = "text-xl font-900 text-slate-300 pb-3 transition-all";
                labelSubmit.innerText = "إنشاء الحساب الآن";
            } else {
                groupName.classList.add('hidden-item');
                btnLogin.className = "text-xl font-900 text-blue-600 border-b-4 border-blue-600 pb-3 transition-all";
                btnSignup.className = "text-xl font-900 text-slate-300 pb-3 transition-all";
                labelSubmit.innerText = "تسجيل الدخول";
            }
        }

        document.getElementById('mainForm').onsubmit = async (e) => {
            e.preventDefault();
            setLoading(true);

            const email = document.getElementById('uEmail').value.trim();
            const pass = document.getElementById('uPass').value.trim();
            const name = document.getElementById('uName').value.trim();

            try {
                const response = await fetch(`${SCRIPT_URL}?action=${activeMode}&email=${encodeURIComponent(email)}&pass=${encodeURIComponent(pass)}&name=${encodeURIComponent(name)}`);
                const result = await response.text();

                // التحقق من الرد الصحيح من السكريبت
                if (result === "LOGIN_SUCCESS" || result === "SIGNUP_SUCCESS") {
                    sessionStorage.setItem('isAuth', 'true');
                    window.location.href = "w/check.html";
                } else if (result === "EMAIL_ALREADY_EXISTS") {
                    alert("⚠️ هذا البريد الإلكتروني مسجل مسبقاً.");
                } else {
                    alert("❌ خطأ: البيانات المدخلة غير صحيحة.");
                }
            } catch (err) {
                alert("🚫 خطأ في الاتصال بالسيرفر، يرجى المحاولة لاحقاً.");
            }
            setLoading(false);
        };

        async function handleGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const res = await firebase.auth().signInWithPopup(provider);
                const user = res.user;
                // إرسال كـ Signup للجدول لضمان الحفظ
                await fetch(`${SCRIPT_URL}?action=signup&email=${encodeURIComponent(user.email)}&name=${encodeURIComponent(user.displayName)}&pass=GOOGLE_AUTH`);
                
                sessionStorage.setItem('isAuth', 'true');
                window.location.href = "w/check.html";
            } catch (err) {
                alert("⚠️ فشل الدخول عبر جوجل. تأكد من السماح بالنوافذ المنبثقة.");
            }
        }

        function setLoading(status) {
            document.getElementById('loaderSubmit').classList.toggle('hidden-item', !status);
            document.getElementById('labelSubmit').classList.toggle('hidden-item', status);
            document.getElementById('btnSubmit').disabled = status;
        }
    </script>
</body>
</html>
