<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash | Authentification</title>
    <style>
        :root {
            --primary-blue: #1a73e8;
            --hover-blue: #1765cc;
            --text-dark: #202124;
            --border: #dadce0;
            --nav-height: 65px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #ffffff;
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            height: var(--nav-height);
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 5%;
            background: #fff;
            border-bottom: 1px solid var(--border);
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        .logo-section { display: flex; align-items: center; gap: 10px; }
        .logo-section svg { height: 35px; fill: var(--primary-blue); }
        .brand-name { font-size: 1.4rem; font-weight: 800; color: var(--text-dark); }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: var(--nav-height);
            text-align: center;
            padding: 40px 20px;
        }

        .hero-text {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 2rem;
            direction: rtl;
        }

        .auth-card {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* تنسيق الأزرار */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid var(--border);
            width: 100%;
            text-decoration: none;
        }

        .btn-google { background: white; color: var(--text-dark); }
        .btn-google:hover { background: #f8f9fa; }

        .btn-blue { background: var(--primary-blue); color: white; border: none; }
        .btn-blue:hover { background: var(--hover-blue); }

        /* حقول الإدخال المخفية حتى يتم الضغط على الأزرار */
        .input-group {
            display: none; /* تظهر فقط عند الحاجة */
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        input {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
        }

        .divider {
            margin: 10px 0;
            display: flex;
            align-items: center;
            color: #70757a;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); margin: 0 10px; }

        #status-msg { margin-top: 20px; font-weight: bold; font-size: 0.9rem; min-height: 20px; }
    </style>
</head>
<body>

    <nav class="toolbar">
        <div class="logo-section">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"></path><path d="M4 19h16v2H4z"></path><path d="M20 7l-2.8 2.8-3.4-3.4-6.2 6.2 1.4 1.4 4.8-4.8 3.4 3.4L22.8 9z"></path></svg>
            <span class="brand-name">LikCash</span>
        </div>
    </nav>

    <main class="main-container">
        <h1 class="hero-text">لا تدع أموالك تنام..<br>اجعلها تعمل لأجلك</h1>
        
        <div class="auth-card">
            <!-- خيار جوجل دائماً في الأعلى -->
            <button class="btn btn-google" id="googleBtn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
                Continuer avec Google
            </button>

            <div class="divider">OU</div>

            <!-- أزرار التبديل -->
            <button class="btn btn-blue" id="showLogin">Connexion</button>
            <button class="btn btn-blue" id="showSignup">S'inscrire</button>

            <!-- فورم الدخول/التسجيل الموحد (يظهر عند الضغط) -->
            <div id="extraFields" class="input-group">
                <input type="text" id="userName" placeholder="Nom complet (pour l'inscription)" style="display:none;">
                <input type="email" id="userEmail" placeholder="Adresse e-mail">
                <input type="password" id="userPass" placeholder="Mot de passe">
                <button class="btn btn-blue" id="submitBtn">Continuer</button>
            </div>
        </div>

        <div id="status-msg"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBP77A_0dc3Z1H6jrUmhtapLF1w0Gbe4B8",
            authDomain: "likcash-auth.firebaseapp.com",
            projectId: "likcash-auth",
            storageBucket: "likcash-auth.firebasestorage.app",
            messagingSenderId: "19126222896",
            appId: "1:19126222896:web:0a6416948afa024e53adf5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxEm2tv_dKpOeIlMIfe0L2lbJ0atxE-cOKW4UHDjKm96sJVoGSIgbNrDUF8QTy74c3oWQ/exec';

        const status = document.getElementById('status-msg');
        let currentMode = ""; // لتحديد هل المستخدم يريد Login أم Signup

        // إظهار حقول الإدخال
        document.getElementById('showLogin').onclick = () => {
            currentMode = "Email-Login";
            document.getElementById('extraFields').style.display = 'flex';
            document.getElementById('userName').style.display = 'none';
        };

        document.getElementById('showSignup').onclick = () => {
            currentMode = "Email-Signup";
            document.getElementById('extraFields').style.display = 'flex';
            document.getElementById('userName').style.display = 'block';
        };

        // وظيفة الإرسال المشتركة
        async function sendData(email, name, method) {
            status.innerText = "Enregistrement en cours...";
            status.style.color = "var(--primary-blue)";
            
            const payload = {
                email: email,
                name: name,
                userId: "ID-" + Math.floor(Math.random() * 9000 + 1000),
                method: method
            };

            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            
            status.innerText = "Succès ! Redirection...";
            status.style.color = "#188038";
            setTimeout(() => { window.location.href = "w/check.html"; }, 1000);
        }

        // تسجيل الدخول بجوجل
        document.getElementById('googleBtn').onclick = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                await sendData(result.user.email, result.user.displayName, "Google");
            } catch (e) { status.innerText = "Erreur Google."; }
        };

        // التسجيل اليدوي
        document.getElementById('submitBtn').onclick = async () => {
            const email = document.getElementById('userEmail').value;
            const name = document.getElementById('userName').value || "Utilisateur";
            if(!email) return alert("Email requis");
            await sendData(email, name, currentMode);
        };
    </script>
</body>
</html>
