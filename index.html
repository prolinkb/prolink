<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash | Authentification</title>
    <style>
        :root {
            --primary-blue: #1a73e8;
            --hover-blue: #1765cc;
            --text-dark: #202124;
            --border: #dadce0;
            --bg-gray: #f8f9fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Google Sans', Arial, sans-serif; }

        body {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
        }

        .brand-logo {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-blue);
            margin-bottom: 10px;
            display: block;
        }

        .hero-title {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--text-dark);
            direction: rtl;
        }

        /* Tabs */
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            flex: 1;
            padding: 12px;
            cursor: pointer;
            font-weight: 500;
            color: #5f6368;
            transition: 0.3s;
        }

        .tab.active {
            color: var(--primary-blue);
            border-bottom: 2px solid var(--primary-blue);
        }

        /* Forms */
        .form-section { display: none; flex-direction: column; gap: 15px; }
        .form-section.active { display: flex; }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 1rem;
        }

        input:focus { border-color: var(--primary-blue); outline: none; }

        .btn-main {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-main:hover { background: var(--hover-blue); }

        .divider {
            margin: 20px 0;
            display: flex;
            align-items: center;
            color: #70757a;
            font-size: 0.8rem;
        }

        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); margin: 0 10px; }

        .btn-google {
            width: 100%;
            padding: 10px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 500;
        }

        #msg { margin-top: 15px; font-size: 0.9rem; min-height: 20px; }
    </style>
</head>
<body>

    <div class="auth-container">
        <span class="brand-logo">LikCash</span>
        <h1 class="hero-title">مرحباً بك في مستقبل استثماراتك</h1>

        <div class="tabs">
            <div class="tab active" id="t-login" onclick="toggleMode('login')">Connexion</div>
            <div class="tab" id="t-signup" onclick="toggleMode('signup')">S'inscrire</div>
        </div>

        <!-- Login Form -->
        <div id="f-login" class="form-section active">
            <input type="email" id="email-login" placeholder="Email">
            <input type="password" id="pass-login" placeholder="Mot de passe">
            <button class="btn-main" onclick="submitAuth('Manual-Login')">Se connecter</button>
        </div>

        <!-- Signup Form -->
        <div id="f-signup" class="form-section">
            <input type="text" id="name-signup" placeholder="Nom complet">
            <input type="email" id="email-signup" placeholder="Email">
            <input type="password" id="pass-signup" placeholder="Mot de passe">
            <button class="btn-main" onclick="submitAuth('Manual-Signup')">Créer un compte</button>
        </div>

        <div class="divider">OU</div>

        <button class="btn-google" id="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
            Continuer مع Google
        </button>

        <div id="msg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBP77A_0dc3Z1H6jrUmhtapLF1w0Gbe4B8",
            authDomain: "likcash-auth.firebaseapp.com",
            projectId: "likcash-auth",
            storageBucket: "likcash-auth.firebasestorage.app",
            messagingSenderId: "19126222896",
            appId: "1:19126222896:web:0a6416948afa024e53adf5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // الرابط الجديد الخاص بك
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw_oWrv5aHaVZp3yiG4HL2WlJGEln0L1CLEvYxx7SJ8RtPoqt7-sKNcbM7_r9kr3u-rmA/exec';

        const msgDiv = document.getElementById('msg');

        // تبديل الواجهة
        window.toggleMode = (mode) => {
            document.getElementById('f-login').classList.toggle('active', mode === 'login');
            document.getElementById('f-signup').classList.toggle('active', mode === 'signup');
            document.getElementById('t-login').classList.toggle('active', mode === 'login');
            document.getElementById('t-signup').classList.toggle('active', mode === 'signup');
            msgDiv.innerText = "";
        };

        // إرسال البيانات
        window.submitAuth = async (method) => {
            const isLogin = method === 'Manual-Login';
            const email = isLogin ? document.getElementById('email-login').value : document.getElementById('email-signup').value;
            const name = isLogin ? "Utilisateur" : document.getElementById('name-signup').value;

            if (!email) { msgDiv.innerText = "Email مطلوب"; return; }

            msgDiv.innerText = "جاري الحفظ في الجدول...";
            msgDiv.style.color = "blue";

            const payload = {
                email: email,
                name: name,
                userId: "ID-" + Math.floor(Math.random() * 10000),
                method: method
            };

            try {
                // إرسال البيانات للجدول
                await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                
                msgDiv.innerText = "تم بنجاح! جاري التوجيه...";
                msgDiv.style.color = "green";
                setTimeout(() => { window.location.href = "w/check.html"; }, 1500);
            } catch (e) {
                msgDiv.innerText = "خطأ في الاتصال";
                msgDiv.style.color = "red";
            }
        };

        // تسجيل جوجل
        document.getElementById('google-btn').onclick = async () => {
            try {
                const res = await signInWithPopup(auth, provider);
                const user = res.user;
                
                // إرسال بيانات جوجل للجدول
                const payload = {
                    email: user.email,
                    name: user.displayName,
                    userId: user.uid,
                    method: "Google"
                };

                await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                window.location.href = "w/check.html";
            } catch (e) {
                msgDiv.innerText = "فشل تسجيل جوجل";
            }
        };
    </script>
</body>
</html>
