<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash | Bienvenue</title>
    <style>
        :root {
            --primary-blue: #1a73e8;
            --text-dark: #202124;
            --text-muted: #5f6368;
            --border: #dadce0;
            --nav-height: 65px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Toolbar */
        .toolbar {
            height: var(--nav-height);
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 5%;
            background: #fff;
            border-bottom: 1px solid var(--border);
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-section svg {
            height: 35px;
            width: auto;
            fill: var(--primary-blue);
        }

        .brand-name {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        /* Main Content */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: var(--nav-height);
            text-align: center;
            padding: 0 20px;
        }

        .hero-section {
            max-width: 500px;
            width: 100%;
        }

        .hero-text {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 1rem;
            color: var(--text-dark);
        }

        .sub-text {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 3rem;
        }

        .auth-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--border);
            width: 100%;
            text-decoration: none;
        }

        .btn-google {
            background-color: #ffffff;
            color: var(--text-dark);
        }

        .btn-google:hover {
            background-color: #f8f9fa;
            border-color: #c2c4c7;
        }

        .btn-login {
            background-color: var(--primary-blue);
            color: #ffffff;
            border: none;
        }

        .btn-login:hover {
            background-color: #1765cc;
        }

        #status-msg {
            margin-top: 25px;
            font-size: 0.95rem;
            font-weight: 600;
            min-height: 24px;
        }

        /* Loading Spinner Simple */
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <nav class="toolbar">
        <div class="logo-section">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"></path>
                <path d="M4 19h16v2H4z"></path>
                <path d="M20 7l-2.8 2.8-3.4-3.4-6.2 6.2 1.4 1.4 4.8-4.8 3.4 3.4L22.8 9z"></path>
            </svg>
            <span class="brand-name">LikCash</span>
        </div>
    </nav>

    <main class="main-container">
        <div class="hero-section">
            <h1 class="hero-text">لا تدع أموالك تنام..<br>اجعلها تعمل لأجلك</h1>
            <p class="sub-text">Inscrivez-vous pour commencer à fructifier vos gains.</p>
            
            <div class="auth-options">
                <button class="btn btn-google" id="googleBtn">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
                    Continuer avec Google
                </button>

                <button class="btn btn-login" id="loginBtn">
                    Se connecter
                </button>
            </div>

            <div id="loader" class="loader"></div>
            <div id="status-msg"></div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Configuration Firebase (LikCash-Auth)
        const firebaseConfig = {
            apiKey: "AIzaSyBP77A_0dc3Z1H6jrUmhtapLF1w0Gbe4B8",
            authDomain: "likcash-auth.firebaseapp.com",
            projectId: "likcash-auth",
            storageBucket: "likcash-auth.firebasestorage.app",
            messagingSenderId: "19126222896",
            appId: "1:19126222896:web:0a6416948afa024e53adf5",
            measurementId: "G-Q4Z0JB801H"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Google Sheets Apps Script URL
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxQpXsqORRZH2fBjnevmwtYmBf_HrHDL9FKy-rlDrP-qDvZ4AABzzJO3WbIL2zLg3dPvA/exec';

        const statusMsg = document.getElementById('status-msg');
        const loader = document.getElementById('loader');

        document.getElementById('googleBtn').onclick = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                loader.style.display = "block";
                statusMsg.innerText = "Connexion réussie...";
                statusMsg.style.color = "#188038";

                // Préparation des données pour Google Sheets
                const payload = {
                    email: user.email,
                    name: user.displayName,
                    userId: "ID-" + Math.floor(Math.random() * 9000 + 1000)
                };

                // Envoi vers Google Sheets
                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    body: JSON.stringify(payload)
                });

                // Redirection après 1.5 seconde
                setTimeout(() => {
                    window.location.href = "w/check.html";
                }, 1500);

            } catch (error) {
                console.error(error);
                loader.style.display = "none";
                statusMsg.innerText = "Erreur lors de la connexion.";
                statusMsg.style.color = "#d93025";
            }
        };

        document.getElementById('loginBtn').onclick = () => {
            // Optionnel : redirection ou modal pour login classique
            statusMsg.innerText = "Redirection vers la page de connexion...";
            statusMsg.style.color = var(--primary-blue);
        };
    </script>
</body>
</html>
