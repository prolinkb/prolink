<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash | Connexion</title>
    <style>
        :root {
            --primary-blue: #1a73e8;
            --text-dark: #202124;
            --border: #dadce0;
            --nav-height: 65px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #ffffff;
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            height: var(--nav-height);
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 5%;
            background: #fff;
            border-bottom: 1px solid var(--border);
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        .logo-section { display: flex; align-items: center; gap: 10px; }
        .logo-section svg { height: 35px; width: auto; fill: var(--primary-blue); }
        .brand-name { font-size: 1.4rem; font-weight: 800; color: var(--text-dark); }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: var(--nav-height);
            text-align: center;
            padding: 0 20px;
        }

        .hero-text {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 3rem;
            color: var(--text-dark);
        }

        .auth-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid var(--border);
            width: 100%;
        }

        .btn-google { background-color: #ffffff; color: var(--text-dark); }
        .btn-google:hover { background-color: #f8f9fa; }
        .btn-login { background-color: var(--primary-blue); color: #ffffff; border: none; }

        #status-msg { margin-top: 20px; font-size: 0.9rem; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="toolbar">
        <div class="logo-section">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"></path><path d="M4 19h16v2H4z"></path><path d="M20 7l-2.8 2.8-3.4-3.4-6.2 6.2 1.4 1.4 4.8-4.8 3.4 3.4L22.8 9z"></path></svg>
            <span class="brand-name">LikCash</span>
        </div>
    </nav>

    <main class="main-container">
        <h1 class="hero-text">لا تدع أموالك تنام..<br>اجعلها تعمل لأجلك</h1>
        
        <div class="auth-options">
            <button class="btn btn-google" id="googleBtn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
                Continuer avec Google
            </button>
            <button class="btn btn-login">Se connecter</button>
        </div>

        <div id="status-msg"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBP77A_0dc3Z1H6jrUmhtapLF1w0Gbe4B8",
            authDomain: "likcash-auth.firebaseapp.com",
            projectId: "likcash-auth",
            storageBucket: "likcash-auth.firebasestorage.app",
            messagingSenderId: "19126222896",
            appId: "1:19126222896:web:0a6416948afa024e53adf5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        
        // رابط Apps Script الخاص بك
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxQpXsqORRZH2fBjnevmwtYmBf_HrHDL9FKy-rlDrP-qDvZ4AABzzJO3WbIL2zLg3dPvA/exec';

        document.getElementById('googleBtn').onclick = async () => {
            const status = document.getElementById('status-msg');
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // البيانات التي سنرسلها للشيت بالفرنسية
                const payload = {
                    email: user.email,
                    name: user.displayName,
                    userId: "ID-" + Math.floor(Math.random() * 9000 + 1000)
                };

                // إرسال البيانات (بصمت) إلى Google Sheets
                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    body: JSON.stringify(payload)
                });

                status.innerText = "Bienvenue, " + user.displayName + " !";
                status.style.color = "#188038";

            } catch (error) {
                status.innerText = "Erreur de connexion.";
                status.style.color = "#d93025";
            }
        };
    </script>
</body>
</html>
