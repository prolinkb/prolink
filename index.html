<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash | Authentification</title>
    <style>
        :root { --primary: #1a73e8; --error: #d93025; --success: #1e8e3e; --border: #dadce0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { width: 100%; max-width: 400px; background: white; padding: 40px 30px; border: 1px solid var(--border); border-radius: 8px; text-align: center; }
        .brand { font-size: 2.2rem; font-weight: bold; color: var(--primary); margin-bottom: 30px; display: block; }
        .tabs { display: flex; margin-bottom: 25px; border-bottom: 1px solid var(--border); }
        .tab { flex: 1; padding: 12px; cursor: pointer; font-weight: 500; color: #5f6368; }
        .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .form-section { display: none; flex-direction: column; gap: 15px; }
        .form-section.active { display: flex; }
        input { width: 100%; padding: 13px; border: 1px solid var(--border); border-radius: 4px; font-size: 1rem; outline: none; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 13px; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        #status-msg { margin-top: 20px; font-size: 0.9rem; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>

    <div class="auth-card">
        <span class="brand">LikCash</span>
        
        <div class="tabs">
            <div class="tab active" onclick="switchMode('login', this)">Connexion</div>
            <div class="tab" onclick="switchMode('signup', this)">S'inscrire</div>
        </div>

        <div id="form-login" class="form-section active">
            <input type="email" id="l-email" placeholder="Email">
            <input type="password" id="l-pass" placeholder="Mot de passe">
            <button class="btn-submit" onclick="handleAuth('Manual-Login')">Se connecter</button>
        </div>

        <div id="form-signup" class="form-section">
            <input type="text" id="s-name" placeholder="Nom complet">
            <input type="email" id="s-email" placeholder="Email">
            <input type="password" id="s-pass" placeholder="Mot de passe">
            <button class="btn-submit" onclick="handleAuth('Manual-Signup')">Créer un compte</button>
        </div>

        <div id="status-msg"></div>
    </div>

    <script>
        // ضع هنا رابط السكريبت الجديد (الذي يحتوي على doGet)
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzp-Ao9ZhPvFtVdL8mfgxqNbgEzbAHXYdcKeINJX25--PUs_5jqxahz37vBTt_De9RAMg/exec';
        const status = document.getElementById('status-msg');

        function switchMode(mode, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('form-login').classList.toggle('active', mode === 'login');
            document.getElementById('form-signup').classList.toggle('active', mode === 'signup');
            status.innerText = "";
        }

        function handleAuth(method) {
            const isLogin = method === 'Manual-Login';
            const email = isLogin ? document.getElementById('l-email').value : document.getElementById('s-email').value;
            const pass = isLogin ? document.getElementById('l-pass').value : document.getElementById('s-pass').value;
            const name = isLogin ? "" : document.getElementById('s-name').value;

            if (!email || !pass) {
                status.innerText = "يرجى إدخال جميع المعلومات";
                status.style.color = "red";
                return;
            }

            status.innerText = "جاري التحقق من البيانات...";
            status.style.color = "blue";

            // تقنية JSONP للتحقق الحقيقي
            const callbackName = 'authCallback';
            const finalURL = `${scriptURL}?callback=${callbackName}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(pass)}&name=${encodeURIComponent(name)}&method=${method}`;

            window[callbackName] = function(response) {
                const res = response.result;

                if (res === "SIGNUP_SUCCESS" || res === "LOGIN_SUCCESS") {
                    status.innerText = "تم القبول! جاري التوجيه...";
                    status.style.color = "green";
                    setTimeout(() => { window.location.href = "w/check.html"; }, 1000);
                } 
                else if (res === "EMAIL_EXISTS") {
                    status.innerText = "هذا البريد مسجل مسبقاً!";
                    status.style.color = "red";
                }
                else if (res === "USER_NOT_FOUND") {
                    status.innerText = "هذا الحساب غير موجود، يرجى التسجيل أولاً";
                    status.style.color = "red";
                }
                else if (res === "WRONG_PASSWORD") {
                    status.innerText = "كلمة السر خاطئة!";
                    status.style.color = "red";
                }

                // تنظيف السكريبت بعد الرد
                document.body.removeChild(scriptTag);
                delete window[callbackName];
            };

            const scriptTag = document.createElement('script');
            scriptTag.src = finalURL;
            document.body.appendChild(scriptTag);
        }
    </script>
</body>
</html>
