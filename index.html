<!DOCTYPE html> 
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash Pro | Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card {
            background: white;
            border: 1px solid #e2e8f0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .loader {
            width: 20px; height: 20px; border: 3px solid #FFF;
            border-bottom-color: transparent; border-radius: 50%;
            display: inline-block; animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg) } 100% { transform: rotate(360deg) } }
        .hidden-step { display: none; }
    </style>
</head>
<body>

    <div class="w-full max-w-[420px] glass-card rounded-[2.5rem] p-8 md:p-10 shadow-xl">
        
        <div class="text-center mb-8">
            <img src="https://i.postimg.cc/zffZkRtk/31998-removebg-preview.png" alt="LikCash" class="h-8 mx-auto mb-4">
            <h1 id="title" class="text-2xl font-800 text-slate-900">Identification</h1>
            <div id="step-indicator" class="flex justify-center gap-2 mt-4">
                <span class="w-8 h-1 rounded-full bg-blue-600 transition-all duration-300"></span>
                <span class="w-2 h-1 rounded-full bg-slate-200 transition-all duration-300"></span>
            </div>
        </div>

        <form id="authForm" class="space-y-5">
            <div id="step1" class="space-y-4">
                <div class="space-y-2">
                    <label class="text-[11px] font-bold text-slate-400 uppercase ml-1">Email Personnel</label>
                    <input type="email" id="uEmail" placeholder="mail@example.com" required
                        class="w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-100 outline-none focus:border-blue-500 font-semibold transition-all">
                </div>
                <button type="button" onclick="toStep(2)" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-blue-600 transition-all shadow-lg">
                    Suivant
                </button>
            </div>

            <div id="step2" class="space-y-4 hidden-step">
                <div class="space-y-2">
                    <label class="text-[11px] font-bold text-slate-400 uppercase ml-1">Mot de passe</label>
                    <input type="password" id="uPass" placeholder="••••••••"
                        class="w-full px-5 py-4 rounded-2xl bg-slate-50 border border-slate-100 outline-none focus:border-blue-500 font-semibold transition-all">
                </div>
                <div class="flex gap-2">
                    <button type="button" onclick="toStep(1)" class="w-1/3 bg-slate-100 text-slate-600 py-4 rounded-2xl font-bold">Retour</button>
                    <button type="submit" id="mainBtn" class="w-2/3 bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg flex items-center justify-center gap-2">
                        <span id="btnText">Connexion</span>
                        <span id="btnLoader" class="loader hidden"></span>
                    </button>
                </div>
            </div>
        </form>

        <div class="relative my-8">
            <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-100"></span></div>
            <span class="relative bg-white px-4 text-slate-400 text-[10px] font-bold uppercase mx-auto block w-fit">Ou</span>
        </div>

        <button onclick="loginGoogle()" class="w-full flex items-center justify-center gap-3 border border-slate-200 py-4 rounded-2xl hover:bg-slate-50 transition-all">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5">
            <span class="text-sm font-bold text-slate-700">Continuer avec Google</span>
        </button>
    </div>

    <script>
        // --- إعدادات الربط (ضع روابطك هنا) ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwKNcZ3SaK1Bd21Zz-7RKqchsMOzeh1h-BqrLYZ2Hyjnnx-DSJGi9f2ekwpgn-VKlJfIQ/exec"; 
        
        const firebaseConfig = {
            apiKey: "AIzaSyBP77A_0dc3Z1H6jrUmhtapLF1w0Gbe4B8",
            authDomain: "likcash-auth.firebaseapp.com",
            projectId: "likcash-auth",
            storageBucket: "likcash-auth.firebasestorage.app",
            messagingSenderId: "19126222896",
            appId: "1:19126222896:web:0a6416948afa024e53adf5"
        };
        firebase.initializeApp(firebaseConfig);

        // --- نظام التنقل بين الخطوات ---
        function toStep(step) {
            const s1 = document.getElementById('step1');
            const s2 = document.getElementById('step2');
            const indicators = document.querySelectorAll('#step-indicator span');

            if(step === 2) {
                if(!document.getElementById('uEmail').value.includes('@')) return alert("Email invalide");
                s1.classList.add('hidden-step');
                s2.classList.remove('hidden-step');
                indicators[1].className = "w-8 h-1 rounded-full bg-blue-600 transition-all";
                indicators[0].className = "w-2 h-1 rounded-full bg-slate-200 transition-all";
            } else {
                s2.classList.add('hidden-step');
                s1.classList.remove('hidden-step');
                indicators[0].className = "w-8 h-1 rounded-full bg-blue-600 transition-all";
                indicators[1].className = "w-2 h-1 rounded-full bg-slate-200 transition-all";
            }
        }

        // --- معالجة الدخول ---
        document.getElementById('authForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('uEmail').value.trim();
            const pass = document.getElementById('uPass').value.trim();

            setLoading(true);
            try {
                const res = await fetch(`${SCRIPT_URL}?action=loginCheck&email=${encodeURIComponent(email)}&pass=${encodeURIComponent(pass)}`);
                const result = await res.text();

                if (result === "FOUND") {
                    sessionStorage.setItem('isAuth', 'true');
                    window.location.href = "w/check.html";
                } else {
                    alert("Email ou Mot de passe incorrect");
                    setLoading(false);
                }
            } catch (err) {
                alert("Erreur serveur");
                setLoading(false);
            }
        };

        // --- جوجل ---
        async function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const res = await firebase.auth().signInWithPopup(provider);
                const user = res.user;
                // حفظ البيانات في السكرت
                fetch(`${SCRIPT_URL}?action=saveData&email=${encodeURIComponent(user.email)}&name=${encodeURIComponent(user.displayName)}&pass=GOOGLE_AUTH`);
                
                sessionStorage.setItem('isAuth', 'true');
                window.location.href = "w/check.html";
            } catch (err) { alert("Erreur Google"); }
        }

        function setLoading(status) {
            document.getElementById('btnText').classList.toggle('hidden', status);
            document.getElementById('btnLoader').classList.toggle('hidden', !status);
            document.getElementById('mainBtn').disabled = status;
        }
    </script>
</body>
</html>
