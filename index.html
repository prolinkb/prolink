<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash | Identification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f3f4f6; }
        .auth-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
        }
        .input-field {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            transition: all 0.3s;
        }
        .input-field:focus {
            border-color: #2563eb;
            background-color: white;
            outline: none;
        }
        .btn-primary {
            background-color: #0f172a;
            transition: background 0.3s;
        }
        .btn-primary:hover { background-color: #1e293b; }
        .loader {
            width: 18px; height: 18px; border: 2px solid #FFF;
            border-bottom-color: transparent; border-radius: 50%;
            display: inline-block; animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg) } 100% { transform: rotate(360deg) } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="auth-card p-8 md:p-10">
        <div class="text-center mb-8">
            <img src="https://i.postimg.cc/zffZkRtk/31998-removebg-preview.png" class="h-6 mx-auto mb-6" alt="LikCash">
            <h1 class="text-2xl font-bold text-slate-800">Identification</h1>
            <div class="w-12 h-1 bg-blue-600 mx-auto mt-2 rounded-full"></div>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-2 mr-1">EMAIL PERSONNEL</label>
                <input type="email" id="email" placeholder="mail@example.com" required 
                       class="w-full px-5 py-4 rounded-xl input-field text-left font-medium">
            </div>

            <button type="submit" id="submitBtn" class="w-full btn-primary text-white py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-3 shadow-lg shadow-slate-200">
                <span id="btnText">Suivant</span>
                <span id="btnLoader" class="loader hidden"></span>
            </button>
        </form>

        <div class="relative my-8 flex items-center">
            <div class="flex-grow border-t border-slate-100"></div>
            <span class="px-3 text-slate-400 text-xs font-bold uppercase">ou</span>
            <div class="flex-grow border-t border-slate-100"></div>
        </div>

        <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 border border-slate-200 py-4 rounded-xl hover:bg-slate-50 transition-all font-bold text-slate-700">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5">
            <span>Continuer avec Google</span>
        </button>

        <p id="statusMsg" class="text-center text-xs font-bold text-blue-600 mt-6"></p>
    </div>

    <script>
        // الرابط الجديد الذي زودتني به
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwsZFBQPcXIeJXMRHgs4x-excfJ06CNvVeGBtqgkkztAb09bo-4RS3Yp2UNVdNpgGW_hA/exec";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyBP77A_0dc3Z1H6jrUmhtapLF1w0Gbe4B8",
            authDomain: "likcash-auth.firebaseapp.com",
            projectId: "likcash-auth",
            storageBucket: "likcash-auth.firebasestorage.app",
            messagingSenderId: "19126222896",
            appId: "1:19126222896:web:0a6416948afa024e53adf5"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        // 1. تسجيل الدخول العادي
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            toggleLoading(true);
            const email = document.getElementById('email').value;

            try {
                // إرسال البيانات للسكريبت وحفظها
                const response = await fetch(`${SCRIPT_URL}?action=signup&email=${encodeURIComponent(email)}&name=User&pass=MANUAL`);
                const result = await response.text();

                if (result.includes("SUCCESS")) {
                    sessionStorage.setItem('isAuth', 'true');
                    window.location.href = "w/check.html";
                }
            } catch (err) {
                alert("خطأ في الاتصال بالخادم");
            }
            toggleLoading(false);
        };

        // 2. تسجيل دخول جوجل (استخدام Redirect لتجاوز حظر النوافذ المنبثقة)
        function loginWithGoogle() {
            document.getElementById('statusMsg').innerText = "جاري التحويل...";
            auth.signInWithRedirect(provider);
        }

        // معالجة النتيجة بعد العودة من جوجل
        auth.getRedirectResult().then(async (result) => {
            if (result.user) {
                const user = result.user;
                document.getElementById('statusMsg').innerText = "تم التحقق، جاري الحفظ...";
                
                const response = await fetch(`${SCRIPT_URL}?action=signup&email=${encodeURIComponent(user.email)}&name=${encodeURIComponent(user.displayName)}&pass=GOOGLE_AUTH`);
                const text = await response.text();
                
                if (text.includes("SUCCESS")) {
                    sessionStorage.setItem('isAuth', 'true');
                    window.location.href = "w/check.html";
                }
            }
        });

        function toggleLoading(isLoading) {
            document.getElementById('btnLoader').classList.toggle('hidden', !isLoading);
            document.getElementById('btnText').classList.toggle('hidden', isLoading);
            document.getElementById('submitBtn').disabled = isLoading;
        }
    </script>
</body>
</html>
