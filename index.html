<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LikCash | بوابة الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f8fafc; font-weight: 900; }
        .hidden { display: none !important; }
        .input-pro { background: #f8fafc; border: 2px solid #e2e8f0; transition: all 0.3s ease; font-weight: 900; }
        .input-pro:focus { border-color: #2563eb; background: #fff; outline: none; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        .loader { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* فرض الخط العريض على كل شيء */
        * { font-weight: 900 !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-[2.5rem] p-10 shadow-2xl border border-slate-50 text-center">
        <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white mx-auto mb-6 shadow-xl shadow-blue-100">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
        </div>
        
        <h1 id="title" class="text-2xl font-black text-slate-900 mb-2">تسجيل الدخول</h1>
        <p id="desc" class="text-slate-500 text-sm mb-8">مرحبا بك في LikCash</p>

        <div id="step-1" class="space-y-4 text-right">
            <div id="name-field" class="hidden space-y-1">
                <label class="text-[11px] text-slate-500 mr-2 uppercase">الاسم الكامل</label>
                <input type="text" id="userName" placeholder="الاسم الكامل" class="input-pro w-full px-5 py-4 rounded-2xl">
            </div>
            
            <div class="space-y-1">
                <label class="text-[11px] text-slate-500 mr-2 uppercase">البريد الالكتروني</label>
                <input type="email" id="userEmail" placeholder="name@mail.com" class="input-pro w-full px-5 py-4 rounded-2xl text-left font-sans">
            </div>

            <div id="pass-field" class="space-y-1 relative">
                <label class="text-[11px] text-slate-500 mr-2 uppercase">كلمة المرور</label>
                <input type="password" id="userPass" placeholder="••••••••" class="input-pro w-full px-5 py-4 rounded-2xl">
                <div class="flex justify-start mt-1">
                    <button onclick="switchToForgot()" class="text-[10px] text-blue-600 hover:underline italic">نسيت كلمة السر؟</button>
                </div>
            </div>

            <button onclick="handleAction()" id="btn1" class="w-full bg-blue-600 text-white py-5 rounded-2xl text-lg flex items-center justify-center gap-3 hover:bg-blue-700 transition-all shadow-lg">
                <span id="text1">دخول</span>
                <div id="load1" class="loader"></div>
            </button>

            <div id="toggle-box" class="text-center mt-6 pt-4 border-t border-slate-50">
                <span id="toggle-text" class="text-slate-400 text-xs">ليس لديك حساب؟</span>
                <button onclick="toggleSignUp()" id="toggle-btn" class="text-blue-600 text-[11px] mr-1 uppercase">انشاء حساب</button>
            </div>
        </div>

        <div id="step-2" class="hidden space-y-6 text-right">
            <div class="bg-blue-50 p-4 rounded-2xl text-center border border-blue-100">
                <p class="text-blue-700 text-sm italic">أدخل رمز التحقق المرسل لبريدك</p>
            </div>

            <div class="space-y-1 text-center">
                <input type="text" id="otpInput" maxlength="4" placeholder="0000" class="w-full text-center text-4xl py-4 rounded-2xl bg-slate-50 border-2 border-blue-600 text-blue-600 outline-none tracking-[0.5rem]">
            </div>

            <div id="new-pass-box" class="hidden space-y-1">
                <label class="text-[11px] text-slate-500 mr-2 uppercase">كلمة المرور الجديدة</label>
                <input type="password" id="newPass" placeholder="••••••••" class="input-pro w-full px-5 py-4 rounded-2xl">
            </div>

            <button onclick="finalAction()" id="btn2" class="w-full bg-slate-900 text-white py-5 rounded-2xl text-lg flex items-center justify-center gap-3 hover:bg-black transition-all">
                <span id="text2">تأكيد</span>
                <div id="load2" class="loader"></div>
            </button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwiuTvylQcYldpawaflTlXm6wdfzv-a4gt8Mi53rwfCo-GIr2_IZeoilmLVXd_WZoD6/exec";
        let serverOTP = "";
        let mode = "login"; 

        function toggleSignUp() {
            mode = (mode === "signup") ? "login" : "signup";
            document.getElementById('title').innerText = mode === "signup" ? "انشاء حساب" : "تسجيل الدخول";
            document.getElementById('name-field').classList.toggle('hidden', mode !== "signup");
            document.getElementById('pass-field').classList.remove('hidden');
            document.getElementById('text1').innerText = mode === "signup" ? "تسجيل" : "دخول";
            document.getElementById('toggle-text').innerText = mode === "signup" ? "عندك حساب؟" : "ليس لديك حساب؟";
            document.getElementById('toggle-btn').innerText = mode === "signup" ? "دخول" : "انشاء حساب";
        }

        function switchToForgot() {
            mode = "forgot";
            document.getElementById('title').innerText = "استعادة الحساب";
            document.getElementById('pass-field').classList.add('hidden');
            document.getElementById('text1').innerText = "بحث عن الحساب";
            document.getElementById('toggle-btn').innerText = "رجوع";
            document.getElementById('toggle-btn').onclick = () => location.reload();
        }

        async function handleAction() {
            const email = document.getElementById('userEmail').value;
            const pass = document.getElementById('userPass').value;
            if(!email) return alert("البريد مطلوب");

            document.getElementById('text1').classList.add('hidden');
            document.getElementById('load1').style.display = "block";

            try {
                if(mode === "login") {
                    if(!pass) { alert("كلمة المرور مطلوبة"); return; }
                    const res = await fetch(`${SCRIPT_URL}?action=login&email=${encodeURIComponent(email)}&pass=${encodeURIComponent(pass)}`);
                    const data = await res.json();
                    if(data.status === "success") {
                        alert("تم تسجيل الدخول بنجاح. مرحبا بك " + data.user);
                    } else { alert("البريد أو كلمة المرور غير صحيحة"); }
                } else {
                    const res = await fetch(`${SCRIPT_URL}?action=sendOTP&email=${encodeURIComponent(email)}&isForgot=${mode==='forgot'}`);
                    const data = await res.json();
                    
                    if(data.status === "sent") {
                        serverOTP = String(data.otp);
                        document.getElementById('step-1').classList.add('hidden');
                        document.getElementById('step-2').classList.remove('hidden');
                        if(mode === "forgot") document.getElementById('new-pass-box').classList.remove('hidden');
                    } else if(data.status === "already_exists") {
                        alert("هذا البريد مسجل مسبقا. يرجى تسجيل الدخول.");
                        location.reload();
                    } else {
                        alert("حدث خطأ أو الحساب غير موجود.");
                        location.reload();
                    }
                }
            } catch(e) { alert("خطأ في الاتصال"); }
            finally {
                document.getElementById('text1').classList.remove('hidden');
                document.getElementById('load1').style.display = "none";
            }
        }

        async function finalAction() {
            const otp = document.getElementById('otpInput').value;
            const email = document.getElementById('userEmail').value;
            const pass = mode === "forgot" ? document.getElementById('newPass').value : document.getElementById('userPass').value;
            const name = document.getElementById('userName').value || "User";

            if(otp !== serverOTP) return alert("الرمز غير صحيح");

            document.getElementById('text2').classList.add('hidden');
            document.getElementById('load2').style.display = "block";

            let action = mode === "signup" ? "saveData" : "updatePass";
            try {
                const res = await fetch(`${SCRIPT_URL}?action=${action}&email=${encodeURIComponent(email)}&pass=${encodeURIComponent(pass)}&name=${encodeURIComponent(name)}`);
                const result = await res.json();
                if(result.status === "done") {
                    alert("تمت العملية بنجاح. يرجى تسجيل الدخول.");
                    window.location.href = window.location.pathname; 
                }
            } catch(e) { 
                window.location.href = window.location.pathname; 
            }
        }
    </script>
</body>
</html>
